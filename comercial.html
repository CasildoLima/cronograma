<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle Comercial</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1b2430;font-size:13px}
header{padding:10px 14px;background:#0b2a5b;color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{margin:0;font-size:16px;font-weight:600}
header .upd{font-size:11px;opacity:.8;margin-left:auto}
header a{color:#8dd0f0;font-size:12px;text-decoration:none}
.bar{padding:8px 14px;background:#fff;border-bottom:1px solid #dde3ea;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar select{padding:6px 8px;border:1px solid #c5ced8;border-radius:6px;font-size:13px;background:#fff}
.sl{font-size:11px;color:#46515e;display:flex;align-items:center;gap:4px}
main{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:14px}
.card h2{margin:0 0 2px;font-size:14px;color:#0b2a5b}
.card p.sub{margin:0 0 12px;font-size:11px;color:#5a6673}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 150px;background:#f7f9fb;border:1px solid #e3e9ef;border-radius:7px;padding:9px 11px}
.kpi .v{font-size:19px;font-weight:700;color:#0b2a5b;line-height:1.15}
.kpi .l{font-size:10.5px;color:#5a6673;margin-top:2px}
.kpi.al .v{color:#c0392b}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 7px;text-align:left;border-bottom:1px solid #edf0f3}
th{background:#eef2f6;color:#0b2a5b;font-weight:600;font-size:11px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.est td{background:#fdeeec}
.bw{position:relative;background:#eef1f4;border-radius:3px;height:17px;min-width:120px;overflow:hidden}
.bf{position:absolute;left:0;top:0;bottom:0;background:#2e7d32;border-radius:3px}
.bf.w{background:#f0a500}.bf.r{background:#c0392b}
.cap{position:absolute;top:0;bottom:0;border-left:2px dashed #0b2a5b;opacity:.65}
.pct{position:absolute;right:5px;top:0;line-height:17px;font-size:10.5px;font-weight:700;color:#1b2430}
.sim{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.sim label{font-size:11px;color:#46515e;display:flex;flex-direction:column;gap:3px}
.sim input,.sim select{padding:7px 9px;border:1px solid #c5ced8;border-radius:6px;font-size:14px;background:#fff}
.sim input{width:150px;font-variant-numeric:tabular-nums}
.res{border-top:1px solid #e3e9ef;padding-top:10px}
.res table{font-size:12.5px}
.res td.et{color:#46515e}
.res tr.mk td{font-weight:700;color:#0b2a5b;background:#f7f9fb}
.ok{color:#2e7d32;font-weight:700}.ruim{color:#c0392b;font-weight:700}
.nota{font-size:11px;color:#7a8692;margin-top:9px;line-height:1.45}
</style></head>

const UPD="28/10/2026";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:100000,hash:"SHA-256"},km,{name:"AES-CBC",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(ENC.i)},k,b64(ENC.c));
 return JSON.parse(new TextDecoder().decode(pt));}
async function tentar(pw,silencioso){
 try{const d=await abrir(pw);try{localStorage.setItem("cr_pw",pw)}catch(e){}
  document.getElementById("gate").remove();document.getElementById("app").style.display="";boot(d);return true}
 catch(e){if(!silencioso){document.getElementById("gerr").textContent="Senha incorreta.";}return false}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tentar(document.getElementById("gp").value.trim(),false)});
(async()=>{let p=null;try{p=localStorage.getItem("cr_pw")}catch(e){}if(p)tentar(p,true)})();
function boot(DATA){


/* ---------- parametros do negocio ---------- */
const CAP_DIA=50000;          // R$ por dia util, preco de fabrica
const DIAS_UTEIS_SEM=5;
const CAP_SEM=CAP_DIA*DIAS_UTEIS_SEM;
const PARADAS=[["2026-12-19","2027-01-04","Férias coletivas"]];
// Feriados: dias sem produção além de sábado e domingo.
// TEM QUE BATER com a constante FERIADOS do modAtualizarCronograma.bas.
// Datas em fim de semana podem ficar na lista, não mudam nada.
const FERIADOS=["2026-11-02","2026-11-15","2026-11-20","2026-12-25",
 "2027-01-01","2027-02-08","2027-02-09","2027-03-26","2027-04-21",
 "2027-05-01","2027-05-27","2027-09-07","2027-10-12","2027-11-02",
 "2027-11-15","2027-12-25"];
// etapas ate a liberacao para producao (dias corridos)
const FASE_COM=[["Coleta de Medidas",7],["Detalhamento Técnico",14],
                ["Aprovação do Cliente",7],["Envio Produção",1]];
// Etapas da fabrica, dias corridos, a partir da liberacao:
//  - PPCP: sequencial, sempre 7 dias
//  - espera na fila de corte: a compra de materiais (14 d) roda EM
//    PARALELO com a fila, entao a espera e o MAIOR dos dois
//  - producao, expedicao e montagem: sequenciais
const PPCP=7, COMPRAS=14, EXPED=7, MONT=7;
const PROD={normal:14,lacca:20,lamina:25};
const CONTRATO={normal:60,lacca:65,lamina:70};
// ENTREGA = chegada na casa do cliente, DEPOIS da expedicao e ANTES
// da montagem. O prazo de contrato termina na entrega; a montagem e
// prazo adicional previsto em contrato.
//   contrato = PPCP + espera na fila + producao + expedicao
const tetoFilaDias=ac=>CONTRATO[ac]-PPCP-PROD[ac]-EXPED;           // corridos
const tetoFilaRS=ac=>Math.round(tetoFilaDias(ac)*5/7*CAP_DIA);

/* ---------- datas ---------- */
const D0=Date.UTC(2000,0,1),DAY=86400000;
const di=s=>s?Math.round((Date.parse(s+"T00:00:00Z")-D0)/DAY):null;
const iso=n=>new Date(D0+n*DAY).toISOString().slice(0,10);
const br=n=>{const s=iso(n);return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(2,4)};
const PAR=PARADAS.map(([a,b,n])=>({a:di(a),b:di(b),n}));
const pula=n=>{let m=1;while(m){m=0;for(const p of PAR)if(n>=p.a&&n<=p.b){n=p.b+1;m=1}}return n};
const soma=(ini,d)=>{let n=pula(ini);for(let i=0;i<d;i++)n=pula(n+1);return n};
const hoje=(()=>{const d=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-D0)/DAY)})();
const segunda=n=>{const d=new Date(D0+n*DAY);return n-((d.getUTCDay()+6)%7)};
const FER=new Set(FERIADOS.map(di));
// dia util = nao e sabado, domingo, feriado nem parada
const util=n=>{const w=new Date(D0+n*DAY).getUTCDay();
 return w>=1&&w<=5&&!FER.has(n)&&n===pula(n)};
// quantos dias uteis existem no intervalo [a,b)
const contaUteis=(a,b)=>{let c=0;for(let n=a;n<b;n++)if(util(n))c++;return c};
// dias uteis -> dias corridos, a partir de hoje
const uteisParaCorridos=u=>{let n=hoje,f=0;while(f<u){n++;if(util(n))f++}return n-hoje};

/* ---------- dados ---------- */
const num=v=>{const x=parseFloat(String(v||"").replace(",","."));return isNaN(x)?0:x};
function etapa(s){
 s=(s||"").toLowerCase().trim();
 if(s.indexOf("me ")===0||s==="me")return[11,"11 · Montagem Externa"];
 if(s.indexOf("vendido")>=0)return[-1,"Vendido (pré-projeto)"];
 if(s.indexOf("aguardando obra")>=0)return[0,"Pausado (aguarda obra)"];
 if(s.indexOf("medi")>=0)return[1,"1 · Coleta de Medidas"];
 if(s.indexOf("em execu")>=0)return[2,"2 · Detalhamento Técnico"];
 if(s.indexOf("aguardando defini")>=0)return[3,"3 · Aprovação do Cliente"];
 if(s.indexOf("liberada")>=0)return[5,"5 · Envio Produção"];
 if(s.indexOf("ppcp")>=0)return[6,"6 · PPCP"];
 if(s.indexOf("expedi")>=0)return[10,"10 · Expedição"];
 return[9,"9 · Produção"];
}
const acab=r=>r.lamina==="S"?"lamina":(r.pintura==="S"?"lacca":"normal");
const rows=DATA.map(r=>{const[e,rot]=etapa(r.status);
 return{...r,pv:num(r.pv),et:e,etr:rot,dv:di(r.previsao_corte),dc:di(r.inicio_corte),ac:acab(r)}});

const moeda=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");
const curto=v=>v>=1e6?(v/1e6).toFixed(2).replace(".",",")+" Mi":Math.round(v/1000)+" mil";

/* ---------- filtro de loja ---------- */
const lojas=[...new Set(rows.map(r=>r.loja).filter(Boolean))].sort();
const sel=document.getElementById("fl");
lojas.forEach(l=>{const o=document.createElement("option");o.value=l;o.textContent=l;sel.appendChild(o)});
sel.onchange=render;
document.getElementById("upd").textContent="Dados de "+UPD;
document.getElementById("base").textContent="Capacidade: "+moeda(CAP_DIA)+"/dia útil · "+moeda(CAP_SEM)+"/semana";

function render(){
 const f=sel.value, R=f?rows.filter(r=>r.loja===f):rows;
 const app=document.getElementById("app");
 // comercial = etapas 0 a 3 | fabrica = 5 a 10 | ME (11) ja produziu,
 // nao disputa maquina e por isso fica fora da conta de capacidade.
 const com=R.filter(r=>r.et>=0&&r.et<=3), fab=R.filter(r=>r.et>=5&&r.et<=10);
 const meAll=R.filter(r=>r.et===11);
 const naoIni=fab.filter(r=>r.dc==null);
 const pvCom=com.reduce((a,r)=>a+r.pv,0), pvFab=fab.reduce((a,r)=>a+r.pv,0);
 const pvFila=naoIni.reduce((a,r)=>a+r.pv,0);
 const semProg=fab.filter(r=>r.dc==null&&r.dv==null), pvSemProg=semProg.reduce((a,r)=>a+r.pv,0);
 const filaTotal=pvFila+pvCom;

 /* --- 1. visao geral --- */
 const pvMe=meAll.reduce((a,r)=>a+r.pv,0);
 let h=`<div class="card"><h2>Visão geral da carteira</h2>
 <p class="sub">${R.length} projetos${f?" · "+f:""} · a Montagem Externa já saiu da fábrica e não disputa capacidade</p><div class="kpis">
 <div class="kpi"><div class="v">${curto(pvCom+pvFab+pvMe)}</div><div class="l">carteira total</div></div>
 <div class="kpi"><div class="v">${curto(pvCom)}</div><div class="l">funil comercial · ${com.length} proj.</div></div>
 <div class="kpi"><div class="v">${curto(pvFab)}</div><div class="l">na fábrica · ${fab.length} proj.</div></div>
 <div class="kpi"><div class="v">${curto(pvMe)}</div><div class="l">montagem externa · ${meAll.length} proj.</div></div>
 <div class="kpi"><div class="v">${curto(pvSemProg)}</div><div class="l">sem programação de corte</div></div>
 <div class="kpi al"><div class="v">${Math.round(filaTotal/CAP_DIA*7/5)} dias</div><div class="l">fila total, em dias corridos</div></div>
 </div></div>`;

 /* --- 2. carga semanal --- */
 // A previsao de corte e a data em que o projeto COMECA a ser cortado.
 // Um projeto de R$ 100 mil ocupa 2 dias de capacidade, entao o valor
 // precisa ser espalhado pelos dias uteis que ele realmente usa -
 // somar tudo no dia de inicio acusaria estouro que nao existe.
 // Percorre a fila na ordem das datas, consumindo a capacidade do dia
 // como a macro do Excel faz. Espalhar cada projeto isoladamente
 // contaria o mesmo dia duas vezes quando dois comecam juntos.
 const sem={};
 const fila=R.filter(r=>r.dv!=null&&r.dc==null).sort((a,b)=>a.dv-b.dv||b.pv-a.pv);
 let dia=fila.length?fila[0].dv:hoje, resta=CAP_DIA, guarda=0;
 fila.forEach(r=>{
  (sem[segunda(r.dv)]=sem[segunda(r.dv)]||{q:0,v:0}).q++;   // conta o projeto na semana em que entra
  if(r.dv>dia){dia=r.dv;resta=CAP_DIA}                      // a fila andou para a frente
  let falta=r.pv;
  while(falta>0&&guarda++<4000){
   while(!util(dia)){dia++; if(guarda++>4000)break}
   if(resta<=0){dia++; while(!util(dia))dia++; resta=CAP_DIA}
   const usa=Math.min(falta,resta);
   (sem[segunda(dia)]=sem[segunda(dia)]||{q:0,v:0}).v+=usa;
   falta-=usa; resta-=usa;
  }});
 const ks=Object.keys(sem).map(Number).filter(k=>k+7>=hoje).sort((a,b)=>a-b);
 const maxv=Math.max(CAP_SEM,...ks.map(k=>sem[k].v));
 h+=`<div class="card"><h2>Carga programada por semana</h2>
 <p class="sub">Soma do PV dos projetos por semana de previsão de corte. A linha tracejada é a capacidade de ${moeda(CAP_SEM)}.</p>
 <table><tr><th>Semana</th><th class="n">Proj.</th><th class="n">PV programado</th><th>Uso da capacidade</th></tr>`;
 if(!ks.length)h+=`<tr><td colspan="4" style="color:#7a8692">Nada programado para as próximas semanas.</td></tr>`;
 ks.forEach(k=>{const s=sem[k],u=s.v/CAP_SEM,cls=u>1?"r":(u>.9?"w":"");
  h+=`<tr class="${u>1?"est":""}"><td>${br(k)}</td><td class="n">${s.q}</td><td class="n">${moeda(s.v)}</td>
  <td><div class="bw"><div class="bf ${cls}" style="width:${Math.min(s.v/maxv*100,100)}%"></div>
  <div class="cap" style="left:${CAP_SEM/maxv*100}%"></div><div class="pct">${Math.round(u*100)}%</div></div></td></tr>`});
 const tp=ks.reduce((a,k)=>a+sem[k].v,0), cp=ks.length*CAP_SEM;
 const estouram=ks.filter(k=>sem[k].v>CAP_SEM).length;
 if(ks.length)h+=`</table><p class="nota"><b>${estouram} de ${ks.length} semanas</b> acima da capacidade.
  No agregado o período soma ${moeda(tp)} contra ${moeda(cp)} de capacidade (<b>${Math.round(tp/cp*100)}%</b>).
  ${tp<=cp&&estouram>0?"Cabe no total — é problema de distribuição, não de volume: puxar carga das semanas cheias para as vazias resolve sem empurrar nada para frente.":""}</p>`;
 h+=`</div>`;

 /* --- 2a. TETO DE FILA: o numero que decide se o prazo e cumprivel --- */
 {
  const teto=tetoFilaRS("normal"), exc=pvFila-teto;
  const filaDias=Math.round(uteisParaCorridos(pvFila/CAP_DIA));
  // quanto pode ENTRAR por semana para a fila chegar ao teto ate a proxima parada
  const prox=PAR.filter(p=>p.a>hoje).sort((a,b)=>a.a-b.a)[0];
  let plano="";
  if(exc>0&&prox){
   const ut=contaUteis(hoje,prox.a);
   const capAte=ut*CAP_DIA, pode=capAte-exc, porSem=pode/(ut/DIAS_UTEIS_SEM);
   plano=pode>0
    ?`<p class="nota"><b>Plano até ${br(prox.a-1)}:</b> a fábrica consome ${moeda(CAP_SEM)} por semana.
      Liberando no máximo <b>${moeda(porSem)}/semana</b> para produção, a fila drena
      ${moeda(CAP_SEM-porSem)} por semana e chega ao teto antes da parada.
      Isso não é segurar venda — é segurar a <i>liberação</i>: o projeto entra na fila quando há espaço,
      e o cliente recebe uma data real em vez de 60 dias automáticos.</p>`
    :`<p class="nota"><b>Não dá para zerar o excesso até ${br(prox.a-1)}</b> nem parando toda a liberação:
      a capacidade do período (${moeda(capAte)}) é menor que o excesso (${moeda(exc)}).</p>`;
  }
  h+=`<div class="card"><h2>Teto de fila — o prazo de contrato é cumprível?</h2>
  <p class="sub">O contrato de ${CONTRATO.normal} dias vai até a <b>entrega na casa do cliente</b> (a montagem é prazo adicional) e se reparte em
   PPCP ${PPCP} + espera na fila + produção ${PROD.normal} + expedição ${EXPED}.
   Sobram <b>${tetoFilaDias("normal")} dias corridos</b> para a espera — o que limita a fila de corte.</p>
  <div class="kpis">
   <div class="kpi${exc>0?" al":""}"><div class="v">${curto(pvFila)}</div><div class="l">fila de corte hoje · ${filaDias} dias</div></div>
   <div class="kpi"><div class="v">${curto(teto)}</div><div class="l">teto para cumprir ${CONTRATO.normal} dias</div></div>
   <div class="kpi${exc>0?" al":""}"><div class="v">${exc>0?"+":""}${curto(Math.abs(exc))}</div>
    <div class="l">${exc>0?"acima do teto":"abaixo do teto"}</div></div>
   <div class="kpi${exc>0?" al":""}"><div class="v">${exc>0?Math.round(exc/pvFila*100)+"%":"—"}</div>
    <div class="l">${exc>0?"quanto a fila precisa cair":"dentro do limite"}</div></div>
  </div>
  ${exc>0?`<p class="nota" style="color:#c0392b"><b>Com a fila neste tamanho, todo pedido novo nasce atrasado em relação ao que foi prometido.</b>
   Não por falha de execução: a promessa é aritmeticamente impossível. Daí todo pedido virar urgente, e cada furo de fila
   para salvar um atrasar os outros.</p>`:
   `<p class="nota">A fila está dentro do limite: o prazo de contrato é cumprível para pedidos novos.</p>`}
  ${plano}
  <table style="margin-top:10px"><tr><th>Acabamento</th><th class="n">Contrato</th><th class="n">Espera máxima</th><th class="n">Fila máxima</th></tr>
  ${["normal","lacca","lamina"].map(a=>`<tr><td>${a==="normal"?"Sem pintura":a==="lacca"?"Lacca":"Lâmina"}</td>
   <td class="n">${CONTRATO[a]} d</td><td class="n">${tetoFilaDias(a)} d</td><td class="n">${moeda(tetoFilaRS(a))}</td></tr>`).join("")}
  </table></div>`;
 }

 /* --- 2b. janela ate a parada de producao --- */
 PAR.forEach(p=>{
  if(p.b<hoje)return;
  let uteis=0; for(let n=p.a;n<=p.b;n++){const w=new Date(D0+n*DAY).getUTCDay();if(w>=1&&w<=5&&!FER.has(n))uteis++}
  // semanas uteis entre hoje e o inicio da parada
  const livres=contaUteis(hoje,p.a);
  const capAte=livres*CAP_DIA, sobra=capAte-pvFila;
  const dentro=R.filter(r=>r.dv!=null&&r.dc==null&&r.dv>=p.a&&r.dv<=p.b);
  h+=`<div class="card"><h2>${p.n} — ${br(p.a)} a ${br(p.b)}</h2>
  <p class="sub">A produção para no período. Tudo que não entrar na fila antes disso só é cortado a partir de ${br(p.b+1)}.</p>
  <div class="kpis">
   <div class="kpi"><div class="v">${uteis} dias</div><div class="l">dias úteis parados</div></div>
   <div class="kpi al"><div class="v">${curto(uteis*CAP_DIA)}</div><div class="l">capacidade que some do ano</div></div>
   <div class="kpi"><div class="v">${livres} dias</div><div class="l">dias úteis até a parada</div></div>
   <div class="kpi"><div class="v">${curto(capAte)}</div><div class="l">capacidade até a parada</div></div>
   <div class="kpi${sobra<0?" al":""}"><div class="v">${sobra<0?"-":""}${curto(Math.abs(sobra))}</div>
    <div class="l">${sobra<0?"não cabe antes da parada":"ainda cabe antes da parada"}</div></div>
  </div>
  <p class="nota">Fila de produção hoje: <b>${moeda(pvFila)}</b> contra <b>${moeda(capAte)}</b> de capacidade até ${br(p.a-1)}.
  ${sobra>=0?"<b>Cabe.</b> Sobram "+moeda(sobra)+" de espaço para vender e ainda cortar antes do recesso."
           :"<b>Não cabe:</b> "+moeda(-sobra)+" escorregam para depois de "+br(p.b+1)+"."}
  ${dentro.length?" Atenção: "+dentro.length+" projeto(s) estão com previsão de corte DENTRO do período parado.":" Nenhum corte está programado dentro do período."}</p>
  </div>`;
 });

 /* --- 3. backlog por etapa --- */
 const ag={};
 R.forEach(r=>{const k=r.et;(ag[k]=ag[k]||{rot:r.etr,q:0,v:0}).q++;ag[k].v+=r.pv});
 h+=`<div class="card"><h2>Onde o dinheiro está parado</h2>
 <p class="sub">PV por etapa do funil, convertido em dias de fábrica a ${moeda(CAP_DIA)}/dia útil.</p>
 <table><tr><th>Etapa</th><th class="n">Proj.</th><th class="n">PV</th><th class="n">Dias úteis</th><th>Peso</th></tr>`;
 const tv=Object.values(ag).reduce((a,x)=>a+x.v,0)||1;
 Object.keys(ag).map(Number).sort((a,b)=>a-b).forEach(k=>{const a=ag[k];
  h+=`<tr><td>${a.rot}</td><td class="n">${a.q}</td><td class="n">${moeda(a.v)}</td>
  <td class="n">${(a.v/CAP_DIA).toFixed(1)}</td>
  <td><div class="bw" style="min-width:90px"><div class="bf" style="width:${a.v/tv*100}%;background:#0b2a5b"></div></div></td></tr>`});
 h+=`</table></div>`;

 /* --- 3a. capacidade livre por mes: para a loja vender com data --- */
 {
  const ini=new Date(D0+hoje*DAY), A0=ini.getUTCFullYear();
  const meses=[];
  for(let k=0;k<15;k++){
   const a=A0+Math.floor((ini.getUTCMonth()+k)/12), m=(ini.getUTCMonth()+k)%12;
   const p1=Math.round((Date.UTC(a,m,1)-D0)/DAY), p2=Math.round((Date.UTC(a,m+1,1)-D0)/DAY);
   meses.push({a,m,p1,p2,ut:contaUteis(Math.max(p1,hoje),p2)});
  }
  // consome a fila atual mes a mes: ela ocupa a capacidade mais proxima
  let resta=pvFila+pvCom;
  meses.forEach(x=>{const cap=x.ut*CAP_DIA;
   x.cap=cap; x.ocup=Math.min(resta,cap); resta-=x.ocup; x.livre=cap-x.ocup});
  const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const totLivre=meses.reduce((a,x)=>a+x.livre,0);
  const primeiroLivre=meses.find(x=>x.livre>0);
  h+=`<div class="card"><h2>Capacidade livre por mês</h2>
  <p class="sub">A carteira atual (${moeda(pvFila+pvCom)}: fila de corte + funil comercial) ocupa os meses mais próximos.
   O que sobra é o espaço real para vender com data firme.</p>
  <div class="kpis">
   <div class="kpi"><div class="v">${primeiroLivre?MES[primeiroLivre.m]+"/"+String(primeiroLivre.a).slice(2):"—"}</div>
    <div class="l">primeiro mês com espaço</div></div>
   <div class="kpi"><div class="v">${curto(totLivre)}</div><div class="l">livre nos próximos 15 meses</div></div>
   <div class="kpi"><div class="v">${moeda(CAP_DIA)}</div><div class="l">por dia útil</div></div>
  </div>
  <table style="margin-top:12px"><tr><th>Mês</th><th class="n">Dias úteis</th><th class="n">Capacidade</th>
   <th class="n">Comprometido</th><th class="n">Livre</th><th>Ocupação</th></tr>`;
  meses.forEach(x=>{const u=x.cap?x.ocup/x.cap:0;
   h+=`<tr${x.livre<=0?' class="est"':''}><td>${MES[x.m]}/${String(x.a).slice(2)}</td>
   <td class="n">${x.ut}</td><td class="n">${moeda(x.cap)}</td>
   <td class="n">${x.ocup>0?moeda(x.ocup):"—"}</td>
   <td class="n"><b>${x.livre>0?moeda(x.livre):"lotado"}</b></td>
   <td><div class="bw" style="min-width:90px"><div class="bf ${u>=1?"r":(u>.9?"w":"")}" style="width:${Math.min(u*100,100)}%"></div>
   <div class="pct">${Math.round(u*100)}%</div></div></td></tr>`});
  const posCorte=PROD.normal+EXPED+MONT;
  h+=`</table><p class="nota"><b>Atenção:</b> este quadro é de capacidade de <b>corte</b>, não de entrega.
   Depois do corte ainda vêm produção (${PROD.normal} a ${PROD.lamina} d), expedição (${EXPED} d) e montagem (${MONT} d) —
   cerca de <b>${posCorte} a ${PROD.lamina+EXPED+MONT} dias</b>. Um projeto cortado em
   ${primeiroLivre?MES[primeiroLivre.m]:"fevereiro"} entrega no mês seguinte.<br>
   Dias úteis já descontam sábados, domingos, feriados e o recesso.
   Mês "lotado" não quer dizer que não se pode vender: quer dizer que a produção não cabe nele, e a loja deve prometer
   a partir do primeiro mês com espaço. Vender além disso não antecipa nada — transforma o excedente em urgência do mês seguinte.</p></div>`;
 }

 /* --- 3b. pos-venda: fila de vistoria por cliente --- */
 const me=meAll;
 if(me.length){
  const vis={};
  me.forEach(r=>{const k=(r.cliente||"(sem cliente)").trim();
   const v=vis[k]=vis[k]||{q:0,pv:0,dt:null,loja:r.loja,vist:0,amb:[]};
   v.q++; v.pv+=r.pv; if(/vistoria/i.test(r.status))v.vist++;
   const dg=di(r.entrega_prog); if(dg!=null&&(v.dt==null||dg<v.dt))v.dt=dg;
   if(r.ambiente)v.amb.push(r.ambiente)});
  const L=Object.entries(vis).sort((a,b)=>(a[1].dt==null)-(b[1].dt==null)||a[1].dt-b[1].dt);
  const idade=v=>v.dt==null?null:hoje-v.dt;
  const velho=L.filter(([,v])=>idade(v)>90);
  const pvVelho=velho.reduce((a,[,v])=>a+v.pv,0);
  const aguard=L.filter(([,v])=>v.vist>0);
  h+=`<div class="card"><h2>Pós-venda — fila de vistoria e entrega</h2>
  <p class="sub">Obras que saíram da fábrica e ainda não foram baixadas. A visita é por cliente, não por projeto.</p>
  <div class="kpis">
   <div class="kpi"><div class="v">${L.length}</div><div class="l">clientes a visitar</div></div>
   <div class="kpi"><div class="v">${me.length}</div><div class="l">projetos em ME</div></div>
   <div class="kpi"><div class="v">${curto(me.reduce((a,r)=>a+r.pv,0))}</div><div class="l">PV sem baixa</div></div>
   <div class="kpi al"><div class="v">${velho.length}</div><div class="l">parados há mais de 90 dias</div></div>
   <div class="kpi al"><div class="v">${curto(pvVelho)}</div><div class="l">PV nesses ${velho.length}</div></div>
   <div class="kpi"><div class="v">${Math.ceil(L.length/2)} dias</div><div class="l">para zerar, a 2 visitas/dia</div></div>
  </div>
  <table style="margin-top:12px"><tr><th class="n">Dias</th><th>Cliente</th><th>Loja</th>
   <th class="n">Proj.</th><th class="n">PV</th><th class="n">Aguard. vistoria</th></tr>`;
  L.forEach(([k,v])=>{const dd=idade(v);
   const cls=dd>90?"est":"";
   h+=`<tr class="${cls}"><td class="n"><b>${dd==null?"—":dd}</b></td><td>${k}</td>
   <td style="color:#5a6673;font-size:11px">${v.loja||""}</td><td class="n">${v.q}</td>
   <td class="n">${moeda(v.pv)}</td><td class="n">${v.vist?v.vist:"—"}</td></tr>`});
  h+=`</table><p class="nota">Ordenado pela entrega programada mais antiga do cliente. Linhas em vermelho passaram de 90 dias.
  ${aguard.length?"<b>"+aguard.length+" cliente(s)</b> têm projetos no status <i>Aguardando a Vistoria</i> — são os que o sistema já aponta como prontos para a visita.":""}
  Começando pelos ${velho.length} mais antigos, ${Math.round(pvVelho/me.reduce((a,r)=>a+r.pv,0)*100)}% do valor sai nas primeiras visitas.</p></div>`;
 }

 /* --- 4. simulador --- */
 h+=`<div class="card"><h2>Simulador de prazo</h2>
 <p class="sub">Um pedido fechado hoje entra no fim da fila atual. O cálculo usa a carteira acima, não o prazo de tabela.</p>
 <div class="sim">
  <label>Valor do pedido (preço de fábrica)<input id="sv" type="text" inputmode="numeric" value="300.000"></label>
  <label>Acabamento<select id="sa"><option value="normal">Sem pintura</option><option value="lacca">Lacca</option><option value="lamina">Lâmina</option></select></label>
 </div><div class="res" id="res"></div>
 <p class="nota">A fila considerada é de ${moeda(filaTotal)} — tudo que ainda não teve início de corte, somado ao funil comercial.</p></div>`;

 app.innerHTML=h;

 /* simulador: eventos */
 const iv=document.getElementById("sv"), ia=document.getElementById("sa");
 const fmt=()=>{const n=num(iv.value.replace(/\./g,"").replace(",","."));iv.value=n?n.toLocaleString("pt-BR"):""};
 const calc=()=>{
  const v=num(iv.value.replace(/\./g,"").replace(",","."));
  const ac=ia.value, res=document.getElementById("res");
  if(!v){res.innerHTML='<p class="nota">Informe o valor do pedido.</p>';return}
  // fase comercial: prazo de tabela, mas o detalhamento respeita a capacidade.
  // Os projetos pausados (etapa 0, aguardando obra) ficam de fora: eles nao
  // estao consumindo a capacidade de detalhamento, estao parados no cliente.
  const filaDet=com.filter(r=>r.et>=1&&r.et<=2).reduce((a,r)=>a+r.pv,0);
  const detCap=Math.max(FASE_COM[1][1],Math.round(uteisParaCorridos((filaDet+v)/CAP_DIA)));
  let d=hoje, linhas=[];
  FASE_COM.forEach(([rot,dd],i)=>{const usa=i===1?detCap:dd;d=soma(d,usa);
   linhas.push([rot,usa,d,i===1&&detCap>dd?"fila de detalhamento":""])});
  const lib=d;
  // fabrica: a fila de producao e o que manda
  const prodCap=Math.max(PROD[ac],Math.round(uteisParaCorridos((pvFila+v)/CAP_DIA)));
  // PPCP: sequencial
  d=soma(d,PPCP); linhas.push(["Processamento PPCP",PPCP,d,""]);
  // espera na fila de corte, com a compra de materiais em paralelo
  const filaDias=Math.round(uteisParaCorridos((pvFila+v)/CAP_DIA));
  const espera=Math.max(filaDias,COMPRAS);
  d=soma(d,espera);
  linhas.push(["Fila de corte (compras em paralelo)",espera,d,
   filaDias>=COMPRAS?"a fila manda: "+filaDias+" d contra "+COMPRAS+" d de compras"
                    :"as compras mandam: "+COMPRAS+" d contra "+filaDias+" d de fila"]);
  d=soma(d,PROD[ac]); linhas.push(["Produção",PROD[ac],d,""]);
  d=soma(d,EXPED);    linhas.push(["Expedição",EXPED,d,""]);
  const entregaCli=d;                      // marco do contrato
  d=soma(d,MONT);     linhas.push(["Montagem",MONT,d,"prazo adicional, fora dos "+CONTRATO[ac]+" dias"]);
  const iEnt=linhas.length-2;              // ultima linha antes da entrega
  const entrega=entregaCli, real=entrega-lib, prazo=CONTRATO[ac];
  const conclusao=d;              // com a montagem
  const iLib=FASE_COM.length-1;   // ultima linha antes da liberacao
  let t=`<table>`;
  linhas.forEach(([rot,dd,dt,obs],i)=>{
   t+=`<tr${i===iLib?' class="mk"':''}><td class="et">${rot}</td><td class="n">${dd} d</td><td class="n">${br(dt)}</td>
   <td style="color:#c0392b;font-size:11px">${obs}</td></tr>`;
   if(i===iLib)t+=`<tr class="mk"><td>➜ Liberado para produção</td><td class="n"></td><td class="n">${br(lib)}</td><td style="font-size:11px;color:#5a6673">marco zero do contrato</td></tr>`;
   if(i===iEnt)t+=`<tr class="mk"><td>➜ ENTREGA na casa do cliente</td><td class="n"></td><td class="n">${br(entregaCli)}</td><td style="font-size:11px;color:#5a6673">fim do prazo de contrato</td></tr>`});
  t+=`<tr class="mk"><td>➜ Montagem concluída</td><td class="n"></td><td class="n">${br(conclusao)}</td><td></td></tr></table>
  <p class="nota">Da liberação até a <b>entrega</b>: <b class="${real>prazo?"ruim":"ok"}">${real} dias corridos</b>
   contra <b>${prazo}</b> de contrato (${ac==="normal"?"sem pintura":ac}).
   ${real>prazo?"<b class='ruim'>Estoura em "+(real-prazo)+" dias.</b> A fila atual não comporta este pedido no prazo contratual."
   :"Cabe no prazo, com folga de "+(prazo-real)+" dias."}<br>
   Do fechamento do pedido até a entrega: <b>${entrega-hoje} dias corridos</b>
   · montagem concluída em ${br(conclusao)} (<b>${conclusao-hoje} dias</b> do fechamento).</p>`;
  res.innerHTML=t;
 };
 iv.oninput=calc; iv.onblur=()=>{fmt();calc()}; ia.onchange=calc; calc();
}
render();

}
</script></div></body></html>
