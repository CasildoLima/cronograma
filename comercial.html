<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle Comercial</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1b2430;font-size:13px}
header{padding:10px 14px;background:#0b2a5b;color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{margin:0;font-size:16px;font-weight:600}
header .upd{font-size:11px;opacity:.8;margin-left:auto}
header a{color:#8dd0f0;font-size:12px;text-decoration:none}
.bar{padding:8px 14px;background:#fff;border-bottom:1px solid #dde3ea;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar select{padding:6px 8px;border:1px solid #c5ced8;border-radius:6px;font-size:13px;background:#fff}
.sl{font-size:11px;color:#46515e;display:flex;align-items:center;gap:4px}
main{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:14px}
.card h2{margin:0 0 2px;font-size:14px;color:#0b2a5b}
.card p.sub{margin:0 0 12px;font-size:11px;color:#5a6673}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 150px;background:#f7f9fb;border:1px solid #e3e9ef;border-radius:7px;padding:9px 11px}
.kpi .v{font-size:19px;font-weight:700;color:#0b2a5b;line-height:1.15}
.kpi .l{font-size:10.5px;color:#5a6673;margin-top:2px}
.kpi.al .v{color:#c0392b}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 7px;text-align:left;border-bottom:1px solid #edf0f3}
th{background:#eef2f6;color:#0b2a5b;font-weight:600;font-size:11px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.est td{background:#fdeeec}
.bw{position:relative;background:#eef1f4;border-radius:3px;height:17px;min-width:120px;overflow:hidden}
.bf{position:absolute;left:0;top:0;bottom:0;background:#2e7d32;border-radius:3px}
.bf.w{background:#f0a500}.bf.r{background:#c0392b}
.cap{position:absolute;top:0;bottom:0;border-left:2px dashed #0b2a5b;opacity:.65}
.pct{position:absolute;right:5px;top:0;line-height:17px;font-size:10.5px;font-weight:700;color:#1b2430}
.sim{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.sim label{font-size:11px;color:#46515e;display:flex;flex-direction:column;gap:3px}
.sim input,.sim select{padding:7px 9px;border:1px solid #c5ced8;border-radius:6px;font-size:14px;background:#fff}
.sim input{width:150px;font-variant-numeric:tabular-nums}
.res{border-top:1px solid #e3e9ef;padding-top:10px}
.res table{font-size:12.5px}
.res td.et{color:#46515e}
.res tr.mk td{font-weight:700;color:#0b2a5b;background:#f7f9fb}
.ok{color:#2e7d32;font-weight:700}.ruim{color:#c0392b;font-weight:700}
.nota{font-size:11px;color:#7a8692;margin-top:9px;line-height:1.45}
/* destaque do topo: o numero que o vendedor precisa ver na hora */
.hero{background:#0b2a5b;border-color:#0b2a5b;color:#fff;display:flex;flex-wrap:wrap;
 gap:18px;align-items:center;justify-content:space-between;padding:16px 20px}
.heroT{font-size:12px;text-transform:uppercase;letter-spacing:.09em;opacity:.8;margin-bottom:10px}
.heroIn{display:flex;gap:12px;flex-wrap:wrap}
.heroIn label{font-size:10.5px;opacity:.8;display:flex;flex-direction:column;gap:4px}
.heroIn input,.heroIn select{padding:8px 10px;border:1px solid rgba(255,255,255,.3);border-radius:6px;
 font-size:16px;background:rgba(255,255,255,.1);color:#fff;font-variant-numeric:tabular-nums}
.heroIn input{width:150px}
.heroIn select option{color:#1b2430}
.heroR{text-align:right;min-width:230px}
.heroD{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.heroS{font-size:12.5px;opacity:.9;margin-top:7px;line-height:1.5}
.heroB{display:inline-block;margin-top:9px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.heroB.ok{background:#2e7d32}.heroB.ruim{background:#c0392b}
@media(max-width:700px){.heroR{text-align:left}.heroD{font-size:36px}}
</style></head>

const UPD="30/10/2026";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:100000,hash:"SHA-256"},km,{name:"AES-CBC",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(ENC.i)},k,b64(ENC.c));
 return JSON.parse(new TextDecoder().decode(pt));}
async function tentar(pw,silencioso){
 try{const d=await abrir(pw);try{localStorage.setItem("cr_pw",pw)}catch(e){}
  document.getElementById("gate").remove();document.getElementById("app").style.display="";boot(d);return true}
 catch(e){if(!silencioso){document.getElementById("gerr").textContent="Senha incorreta.";}return false}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tentar(document.getElementById("gp").value.trim(),false)});
(async()=>{let p=null;try{p=localStorage.getItem("cr_pw")}catch(e){}if(p)tentar(p,true)})();
function boot(DATA){


/* ---------- parametros do negocio ---------- */
const CAP_DIA=50000;          // R$ por dia util, preco de fabrica
const DIAS_UTEIS_SEM=5;
const CAP_SEM=CAP_DIA*DIAS_UTEIS_SEM;
const PARADAS=[["2026-12-19","2027-01-04","Férias coletivas"]];
// Feriados: dias sem produção além de sábado e domingo.
// TEM QUE BATER com a constante FERIADOS do modAtualizarCronograma.bas.
// Datas em fim de semana podem ficar na lista, não mudam nada.
const FERIADOS=["2026-11-02","2026-11-15","2026-11-20","2026-12-25",
 "2027-01-01","2027-02-08","2027-02-09","2027-03-26","2027-04-21",
 "2027-05-01","2027-05-27","2027-09-07","2027-10-12","2027-11-02",
 "2027-11-15","2027-12-25"];
// etapas ate a liberacao para producao (dias corridos)
const FASE_COM=[["Coleta de Medidas",7],["Detalhamento Técnico",14],
                ["Aprovação do Cliente",7],["Envio Produção",1]];
// Etapas da fabrica, dias corridos, a partir da liberacao:
//  - PPCP: sequencial, sempre 7 dias
//  - espera na fila de corte: a compra de materiais (14 d) roda EM
//    PARALELO com a fila, entao a espera e o MAIOR dos dois
//  - producao, expedicao e montagem: sequenciais
const PPCP=7, COMPRAS=14, EXPED=7, MONT=7;
const PROD={normal:14,lacca:20,lamina:25};
const CONTRATO={normal:60,lacca:65,lamina:70};
// ENTREGA = chegada na casa do cliente, DEPOIS da expedicao e ANTES
// da montagem. O prazo de contrato termina na entrega; a montagem e
// prazo adicional previsto em contrato.
//   contrato = PPCP + espera na fila + producao + expedicao
const tetoFilaDias=ac=>CONTRATO[ac]-PPCP-PROD[ac]-EXPED;           // corridos
const tetoFilaRS=ac=>Math.round(tetoFilaDias(ac)*5/7*CAP_DIA);

/* ---------- datas ---------- */
const D0=Date.UTC(2000,0,1),DAY=86400000;
const di=s=>s?Math.round((Date.parse(s+"T00:00:00Z")-D0)/DAY):null;
const iso=n=>new Date(D0+n*DAY).toISOString().slice(0,10);
const br=n=>{const s=iso(n);return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(2,4)};
const PAR=PARADAS.map(([a,b,n])=>({a:di(a),b:di(b),n}));
const pula=n=>{let m=1;while(m){m=0;for(const p of PAR)if(n>=p.a&&n<=p.b){n=p.b+1;m=1}}return n};
const soma=(ini,d)=>{let n=pula(ini);for(let i=0;i<d;i++)n=pula(n+1);return n};
const hoje=(()=>{const d=new Date();return Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-D0)/DAY)})();
const segunda=n=>{const d=new Date(D0+n*DAY);return n-((d.getUTCDay()+6)%7)};
const FER=new Set(FERIADOS.map(di));
// dia util = nao e sabado, domingo, feriado nem parada
const util=n=>{const w=new Date(D0+n*DAY).getUTCDay();
 return w>=1&&w<=5&&!FER.has(n)&&n===pula(n)};
// quantos dias uteis existem no intervalo [a,b)
const contaUteis=(a,b)=>{let c=0;for(let n=a;n<b;n++)if(util(n))c++;return c};
// dias uteis -> dias corridos, a partir de hoje
const uteisParaCorridos=u=>{let n=hoje,f=0;while(f<u){n++;if(util(n))f++}return n-hoje};
// avanca u dias uteis a partir de uma data qualquer e devolve a data
const avancaUteis=(base,u)=>{let n=base,f=0,g=0;while(f<u&&g++<4000){n++;if(util(n))f++}return n};

/* ---------- dados ---------- */
const num=v=>{const x=parseFloat(String(v||"").replace(",","."));return isNaN(x)?0:x};
function etapa(s){
 s=(s||"").toLowerCase().trim();
 if(s.indexOf("me ")===0||s==="me")return[11,"11 · Montagem Externa"];
 if(s.indexOf("vendido")>=0)return[-1,"Vendido (pré-projeto)"];
 if(s.indexOf("aguardando obra")>=0)return[0,"Pausado (aguarda obra)"];
 if(s.indexOf("medi")>=0)return[1,"1 · Coleta de Medidas"];
 if(s.indexOf("em execu")>=0)return[2,"2 · Detalhamento Técnico"];
 if(s.indexOf("aguardando defini")>=0)return[3,"3 · Aprovação do Cliente"];
 if(s.indexOf("liberada")>=0)return[5,"5 · Envio Produção"];
 if(s.indexOf("ppcp")>=0)return[6,"6 · PPCP"];
 if(s.indexOf("expedi")>=0)return[10,"10 · Expedição"];
 return[9,"9 · Produção"];
}
// mesmo criterio do cronograma e do Excel
const ACAB_PCT=1, ACAB_PISO=3000;
const conta=(valor,pv)=>valor>0&&(valor>=ACAB_PISO||(pv>0&&valor/pv*100>=ACAB_PCT));
const acab=r=>{const pv=num(r.pv);
 if(conta(num(r.pv_lamina),pv))return "lamina";
 if(conta(num(r.pv_pintura),pv))return "lacca";
 return "normal"};
const rows=DATA.map(r=>{const[e,rot]=etapa(r.status);
 return{...r,pv:num(r.pv),et:e,etr:rot,dv:di(r.previsao_corte),dc:di(r.inicio_corte),ac:acab(r)}});

const moeda=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");
const curto=v=>v>=1e6?(v/1e6).toFixed(2).replace(".",",")+" Mi":Math.round(v/1000)+" mil";

/* ---------- filtro de loja ---------- */
const lojas=[...new Set(rows.map(r=>r.loja).filter(Boolean))].sort();
const sel=document.getElementById("fl");
lojas.forEach(l=>{const o=document.createElement("option");o.value=l;o.textContent=l;sel.appendChild(o)});
sel.onchange=render;
document.getElementById("upd").textContent="Dados de "+UPD;
document.getElementById("base").textContent="Capacidade: "+moeda(CAP_DIA)+"/dia útil · "+moeda(CAP_SEM)+"/semana";

function render(){
 const f=sel.value, R=f?rows.filter(r=>r.loja===f):rows;
 const app=document.getElementById("app");
 // comercial = etapas 0 a 3 | fabrica = 5 a 10 | ME (11) ja produziu,
 // nao disputa maquina e por isso fica fora da conta de capacidade.
 const com=R.filter(r=>r.et>=0&&r.et<=3), fab=R.filter(r=>r.et>=5&&r.et<=10);

 const filaDet=com.filter(r=>r.et>=1&&r.et<=2).reduce((a,r)=>a+r.pv,0);
 function simular(v,ac){
  // fase comercial: prazo de tabela, mas o detalhamento respeita a
  // capacidade. Pausados (etapa 0) ficam fora: estao parados no cliente.
  let d=hoje, linhas=[];
  // 1. Coleta de Medidas
  d=soma(d,FASE_COM[0][1]); linhas.push([FASE_COM[0][0],FASE_COM[0][1],d,""]);
  // 2. Detalhamento - a fila dele tambem drena durante a coleta
  const detConsumido=contaUteis(hoje,d)*CAP_DIA;
  const detNaChegada=Math.max(0,filaDet-detConsumido);
  const detCap=Math.max(FASE_COM[1][1],avancaUteis(d,Math.ceil((detNaChegada+v)/CAP_DIA))-d);
  d=soma(d,detCap);
  linhas.push([FASE_COM[1][0],detCap,d,detCap>FASE_COM[1][1]?"fila de "+moeda(detNaChegada)+" no detalhamento":""]);
  // 3 e 4. Aprovacao do cliente e envio para producao
  for(let i=2;i<FASE_COM.length;i++){d=soma(d,FASE_COM[i][1]);linhas.push([FASE_COM[i][0],FASE_COM[i][1],d,""])}
  const lib=d;
  d=soma(d,PPCP); linhas.push(["Processamento PPCP",PPCP,d,""]);
  // A fila DRENA enquanto o projeto esta na fase comercial: quando ele
  // chega na fabrica, boa parte do que estava na frente ja foi cortada.
  // Considerar a fila de hoje faria o pedido esperar uma fila que nao
  // existe mais na data em que ele entra.
  const consumido=contaUteis(hoje,d)*CAP_DIA;
  const filaNaChegada=Math.max(0,pvFila-consumido);
  const fimFila=avancaUteis(d,Math.ceil((filaNaChegada+v)/CAP_DIA));
  const filaDias=fimFila-d;
  const espera=Math.max(filaDias,COMPRAS);
  d=soma(d,espera);
  linhas.push(["Fila de corte (compras em paralelo)",espera,d,
   filaDias>=COMPRAS?"fila de "+moeda(filaNaChegada)+" na data de entrada"
                    :"as compras mandam: "+COMPRAS+" d contra "+filaDias+" d de fila"]);
  d=soma(d,PROD[ac]); linhas.push(["Produção",PROD[ac],d,""]);
  d=soma(d,EXPED);    linhas.push(["Expedição",EXPED,d,""]);
  const entrega=d;                         // fim do prazo de contrato
  const iEnt=linhas.length-1;
  d=soma(d,MONT);     linhas.push(["Montagem",MONT,d,"prazo adicional, fora dos "+CONTRATO[ac]+" dias"]);
  return {linhas,lib,entrega,conclusao:d,real:entrega-lib,prazo:CONTRATO[ac],
          iEnt,iLib:FASE_COM.length-1,filaDias};
 }

 // A previsao de corte e a data em que o projeto COMECA a ser cortado.
 // Um projeto de R$ 100 mil ocupa 2 dias de capacidade, entao o valor
 // precisa ser espalhado pelos dias uteis que ele realmente usa -
 // somar tudo no dia de inicio acusaria estouro que nao existe.
 // Percorre a fila na ordem das datas, consumindo a capacidade do dia
 // como a macro do Excel faz. Espalhar cada projeto isoladamente
 // contaria o mesmo dia duas vezes quando dois comecam juntos.
 const sem={};
 const fila=R.filter(r=>r.dv!=null&&r.dc==null).sort((a,b)=>a.dv-b.dv||b.pv-a.pv);
 let dia=fila.length?fila[0].dv:hoje, resta=CAP_DIA, guarda=0;
 fila.forEach(r=>{
  (sem[segunda(r.dv)]=sem[segunda(r.dv)]||{q:0,v:0}).q++;   // conta o projeto na semana em que entra
  if(r.dv>dia){dia=r.dv;resta=CAP_DIA}                      // a fila andou para a frente
  let falta=r.pv;
  while(falta>0&&guarda++<4000){
   while(!util(dia)){dia++; if(guarda++>4000)break}
   if(resta<=0){dia++; while(!util(dia))dia++; resta=CAP_DIA}
   const usa=Math.min(falta,resta);
   (sem[segunda(dia)]=sem[segunda(dia)]||{q:0,v:0}).v+=usa;
   falta-=usa; resta-=usa;
  }});
 const ks=Object.keys(sem).map(Number).filter(k=>k+7>=hoje).sort((a,b)=>a-b);

  <label>Acabamento<select id="sa"><option value="normal">Sem pintura</option><option value="lacca">Lacca</option><option value="lamina">Lâmina</option></select></label>
 </div><div class="res" id="res"></div>
 <p class="nota">A fila considerada é de ${moeda(filaTotal)} — tudo que ainda não teve início de corte, somado ao funil comercial.</p></div>`;

 app.innerHTML=h;

 /* destaque do topo */
 {
  const hv=document.getElementById("hv"), ha=document.getElementById("ha"), hr=document.getElementById("heroR");
  const calcHero=()=>{
   const v=num(hv.value.replace(/\./g,"").replace(",","."));
   if(!v){hr.innerHTML='<div class="heroS">Informe o valor do pedido.</div>';return}
   const S=simular(v,ha.value);
   const dia=new Date(D0+S.entrega*DAY);
   const mesExt=dia.toLocaleDateString("pt-BR",{month:"long",timeZone:"UTC"});
   hr.innerHTML=`<div class="heroD">${br(S.entrega)}</div>
    <div class="heroS">entrega na casa do cliente · ${mesExt} de ${dia.getUTCFullYear()}<br>
     ${S.entrega-hoje} dias corridos a partir de hoje · liberação para produção em ${br(S.lib)}</div>
    <div class="heroB ${S.real>S.prazo?"ruim":"ok"}">${S.real>S.prazo
      ?S.real+" dias da liberação · "+(S.real-S.prazo)+" acima do contrato de "+S.prazo
      :S.real+" dias da liberação · dentro do contrato de "+S.prazo}</div>`;
  };
  const fmtH=()=>{const n=num(hv.value.replace(/\./g,"").replace(",","."));hv.value=n?n.toLocaleString("pt-BR"):""};
  hv.oninput=calcHero; hv.onblur=()=>{fmtH();calcHero()}; ha.onchange=calcHero; calcHero();
 }

 /* simulador: eventos */
 const iv=document.getElementById("sv"), ia=document.getElementById("sa");
 const fmt=()=>{const n=num(iv.value.replace(/\./g,"").replace(",","."));iv.value=n?n.toLocaleString("pt-BR"):""};
 const calc=()=>{
  const v=num(iv.value.replace(/\./g,"").replace(",","."));
  const ac=ia.value, res=document.getElementById("res");
  if(!v){res.innerHTML='<p class="nota">Informe o valor do pedido.</p>';return}
  const S=simular(v,ac);
  const linhas=S.linhas, lib=S.lib, entregaCli=S.entrega, entrega=S.entrega;
  const real=S.real, prazo=S.prazo, conclusao=S.conclusao;
  const iEnt=S.iEnt, iLib=S.iLib;
  let t=`<table>`;
  linhas.forEach(([rot,dd,dt,obs],i)=>{
   t+=`<tr${i===iLib?' class="mk"':''}><td class="et">${rot}</td><td class="n">${dd} d</td><td class="n">${br(dt)}</td>
   <td style="color:#c0392b;font-size:11px">${obs}</td></tr>`;
   if(i===iLib)t+=`<tr class="mk"><td>➜ Liberado para produção</td><td class="n"></td><td class="n">${br(lib)}</td><td style="font-size:11px;color:#5a6673">marco zero do contrato</td></tr>`;
   if(i===iEnt)t+=`<tr class="mk"><td>➜ ENTREGA na casa do cliente</td><td class="n"></td><td class="n">${br(entregaCli)}</td><td style="font-size:11px;color:#5a6673">fim do prazo de contrato</td></tr>`});
  t+=`<tr class="mk"><td>➜ Montagem concluída</td><td class="n"></td><td class="n">${br(conclusao)}</td><td></td></tr></table>
  <p class="nota">Da liberação até a <b>entrega</b>: <b class="${real>prazo?"ruim":"ok"}">${real} dias corridos</b>
   contra <b>${prazo}</b> de contrato (${ac==="normal"?"sem pintura":ac}).
   ${real>prazo?"<b class='ruim'>Estoura em "+(real-prazo)+" dias.</b> A fila atual não comporta este pedido no prazo contratual."
   :"Cabe no prazo, com folga de "+(prazo-real)+" dias."}<br>
   Do fechamento do pedido até a entrega: <b>${entrega-hoje} dias corridos</b>
   · montagem concluída em ${br(conclusao)} (<b>${conclusao-hoje} dias</b> do fechamento).</p>`;
  res.innerHTML=t;
 };
 iv.oninput=calc; iv.onblur=()=>{fmt();calc()}; ia.onchange=calc; calc();
}
render();

}
</script></div></body></html>
