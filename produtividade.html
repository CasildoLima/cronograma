<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produtividade da Fábrica</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1b2430;font-size:13px}
header{padding:10px 14px;background:#0b2a5b;color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{margin:0;font-size:16px;font-weight:600}
header .upd{font-size:11px;opacity:.8;margin-left:auto}
header a{color:#8dd0f0;font-size:12px;text-decoration:none;margin-left:12px}
main{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:14px}
.card h2{margin:0 0 2px;font-size:14px;color:#0b2a5b}
.card p.sub{margin:0 0 12px;font-size:11px;color:#5a6673;line-height:1.5}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 150px;background:#f7f9fb;border:1px solid #e3e9ef;border-radius:7px;padding:9px 11px}
.kpi .v{font-size:19px;font-weight:700;color:#0b2a5b;line-height:1.15}
.kpi .l{font-size:10.5px;color:#5a6673;margin-top:2px}
.kpi.al .v{color:#c0392b}.kpi.ok .v{color:#2e7d32}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 7px;text-align:left;border-bottom:1px solid #edf0f3}
th{background:#eef2f6;color:#0b2a5b;font-weight:600;font-size:11px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.est td{background:#fdeeec}
.bw{position:relative;background:#eef1f4;border-radius:3px;height:16px;min-width:110px;overflow:hidden}
.bf{position:absolute;left:0;top:0;bottom:0;background:#0b2a5b;border-radius:3px}
.bf.w{background:#f0a500}.bf.r{background:#c0392b}.bf.g{background:#2e7d32}
.pct{position:absolute;right:5px;top:0;line-height:16px;font-size:10.5px;font-weight:700}
.nota{font-size:11px;color:#7a8692;margin-top:9px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:5px 11px;border:1px solid #c5ced8;border-radius:16px;font-size:11.5px;cursor:pointer;background:#fff}
.tab.on{background:#0b2a5b;color:#fff;border-color:#0b2a5b}
.g{display:flex;align-items:stretch;gap:3px;height:130px;margin:10px 0 4px;position:relative;border-bottom:1px solid #cfd7e0}
.cap{position:absolute;left:0;right:0;border-top:1px dashed #0b2a5b;opacity:.5;font-size:9px;color:#0b2a5b;text-align:right}
.g .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.g .b{width:100%;background:#0b2a5b;border-radius:2px 2px 0 0;min-height:2px}
.g .t{font-size:9px;color:#5a6673;white-space:nowrap;transform:rotate(-45deg);transform-origin:top left;height:26px}
.gl{display:flex;gap:14px;font-size:11px;color:#5a6673;margin-top:20px}
.gl i{display:inline-block;width:11px;height:10px;border-radius:2px;margin-right:4px}
</style></head>

const UPD="29/10/2026";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:100000,hash:"SHA-256"},km,{name:"AES-CBC",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(ENC.i)},k,b64(ENC.c));
 return JSON.parse(new TextDecoder().decode(pt));}
async function tentar(pw,silencioso){
 try{const d=await abrir(pw);try{localStorage.setItem("cr_pw",pw)}catch(e){}
  document.getElementById("gate").remove();document.getElementById("app").style.display="";boot(d);return true}
 catch(e){if(!silencioso){document.getElementById("gerr").textContent="Senha incorreta.";}return false}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tentar(document.getElementById("gp").value.trim(),false)});
(async()=>{let p=null;try{p=localStorage.getItem("cr_pw")}catch(e){}if(p)tentar(p,true)})();
function boot(D){

const CAP_MES=1000000;           // capacidade de referencia, R$/mes
const moeda=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");
const curto=v=>v>=1e6?(v/1e6).toFixed(2).replace(".",",")+" Mi":Math.round(v/1000)+" mil";
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const rot=m=>{const[a,b]=m.split("-");return MES[+b-1]+"/"+a.slice(2)};
document.getElementById("upd").textContent="Dados de "+UPD;

const S=D.serie, U=S.slice(-12);
const app=document.getElementById("app");
let h="";

/* ---------- 1. visao geral ---------- */
// O FINAL DE PRODUCAO e lancado em lote - acumula e fecha quando da -
// entao a serie por ele oscila o dobro e nao reflete o ritmo real.
// A visao principal e por INICIO DE CORTE, que e apontado na hora.
const tPV=U.reduce((a,s)=>a+s.cpv,0), tPC=U.reduce((a,s)=>a+s.pc,0);
const tPVf=U.reduce((a,s)=>a+s.fpv,0);
const tFN=U.reduce((a,s)=>a+s.fn,0), tCN=U.reduce((a,s)=>a+s.cn,0);
const tPrev=U.reduce((a,s)=>a+s.prev,0), tReal=U.reduce((a,s)=>a+s.real,0);
const ocup=tPV/12/CAP_MES;
h+=`<div class="card"><h2>Últimos 12 meses</h2>
<p class="sub">Medido pelo <b>início de corte</b>, que é apontado na hora pelo operador. O final de produção é fechado em lote, acumulando vários dias, e por isso oscila o dobro — serve para conferência, não para medir ritmo.<br>Valor a preço de fábrica (empresa Moveis Kretzer): o mesmo projeto existe duas vezes na base, uma com o valor da fábrica e outra com o da loja.</p>
<div class="kpis">
 <div class="kpi"><div class="v">${curto(tPV)}</div><div class="l">iniciado no período</div></div>
 <div class="kpi"><div class="v">${curto(tPV/12)}</div><div class="l">média mensal de corte</div></div>
 <div class="kpi ${ocup<.8?"al":"ok"}"><div class="v">${Math.round(ocup*100)}%</div><div class="l">da capacidade de ${curto(CAP_MES)}/mês</div></div>
 <div class="kpi"><div class="v">${tCN}</div><div class="l">projetos iniciados</div></div>
 <div class="kpi"><div class="v">${tFN}</div><div class="l">finalizados (lançado em lote)</div></div>
 <div class="kpi"><div class="v">${tPC.toLocaleString("pt-BR")}</div><div class="l">peças produzidas</div></div>
</div>
<p class="nota">A fábrica roda a <b>${Math.round(ocup*100)}% da capacidade</b>.
${ocup<.85?"Ou seja: a sensação de estar sempre no limite não vem de falta de capacidade, e sim de fluxo e previsibilidade — fila mal distribuída, retrabalho e espera.":""}</p></div>`;

/* ---------- 2. serie mensal ---------- */
const maxPV=Math.max(...U.map(s=>Math.max(s.cpv,s.fpv)));
h+=`<div class="card"><h2>Produção mês a mês</h2>
<p class="sub">Barra = valor que <b>entrou no corte</b> no mês. A linha tracejada é a capacidade de R$ 1 Mi.</p>
<div class="g">`;
U.forEach(s=>{const al=s.cpv/maxPV*100;
 h+=`<div class="c" title="${rot(s.m)} — iniciado: ${moeda(s.cpv)} em ${s.cn} projetos · finalizado: ${moeda(s.fpv)} em ${s.fn} · ${s.pc.toLocaleString("pt-BR")} peças">
 <div class="b ${s.cpv>=CAP_MES?"g":(s.cpv<CAP_MES*.6?"r":"")}" style="height:${al}%"></div></div>`});
h+=`<div class="cap" style="bottom:${CAP_MES/maxPV*100}%">capacidade ${curto(CAP_MES)}</div>`;
h+=`</div><div style="display:flex;gap:3px;margin-bottom:18px">`;
U.forEach(s=>{h+=`<div style="flex:1;text-align:center;font-size:9.5px;color:#5a6673;min-width:0">${rot(s.m)}</div>`});
h+=`</div>
<table><tr><th>Mês</th><th class="n">Proj.</th><th class="n">Entrou no corte</th><th>Capacidade</th>

U.forEach(s=>{const u=s.cpv/CAP_MES, cc=s.ccpv?s.fcusto/s.ccpv*100:0;
 h+=`<tr><td>${rot(s.m)}</td><td class="n">${s.cn}</td>
 <td class="n"><b>${moeda(s.cpv)}</b></td>
 <td><div class="bw"><div class="bf ${u>=1?"g":(u<.6?"r":"w")}" style="width:${Math.min(u*100,100)}%"></div>
 <div class="pct">${Math.round(u*100)}%</div></div></td>
 <td class="n" style="color:#7a8692">${moeda(s.fpv)}</td>
 <td class="n">${cc?cc.toFixed(0)+"%":"—"}</td>
 <td class="n">${s.pc.toLocaleString("pt-BR")}</td>
 <td class="n">${s.lead!=null?s.lead+"d":"—"}</td></tr>`});
h+=`</table><p class="nota">A coluna <b>Entrou no corte</b> é a medida de ritmo. <b>Finalizado</b> aparece em cinza porque é lançado em lote e distorce o mês.<br>Custo em % do valor, apenas nos projetos com detalhamento. Lead = mediana de dias entre início e final de produção.</p></div>`;

/* ---------- 3. valor por peca ---------- */
h+=`<div class="card"><h2>Valor por peça</h2>
<p class="sub">Pintura e lâmina entram no valor do projeto e distorcem a comparação: dois projetos com as mesmas peças
custam diferente se um for laqueado. A coluna "sem acabamento" tira pintura e lâmina para a base ficar comparável.</p>
<table><tr><th>Mês</th><th class="n">Peças</th><th class="n">Valor detalhado</th><th class="n">Sem acabamento</th>
<th class="n">% acabamento</th><th class="n">R$/peça</th></tr>`;
let sb=0,sd=0;
U.forEach(s=>{const ac=s.det?(1-s.base/s.det)*100:null, rp=s.pc&&s.base?s.base/s.pc:null;
 sb+=s.base||0; sd+=s.det||0;
 h+=`<tr><td>${rot(s.m)}</td><td class="n">${s.pc.toLocaleString("pt-BR")}</td>
 <td class="n">${s.det?moeda(s.det):"—"}</td><td class="n">${s.base?moeda(s.base):"—"}</td>
 <td class="n">${ac!=null?ac.toFixed(1)+"%":"—"}</td>
 <td class="n"><b>${rp?moeda(rp):"—"}</b></td></tr>`});
h+=`</table><p class="nota">No período, <b>${sd?((1-sb/sd)*100).toFixed(1):"—"}%</b> do valor é pintura e lâmina.
<b>Atenção ao R$/peça:</b> as peças vêm dos apontamentos da PPCP, que cobrem parte das ordens, enquanto o valor vem da base inteira.
Serve para tendência, não como valor absoluto — a referência confiável é a mediana de ${moeda(D.qual.mediana_peca||0)}/peça da carteira ativa.</p></div>`;

/* ---------- 4. tempo previsto x real ---------- */
const op=D.oper.filter(o=>o.prev>0).slice(0,12);
h+=`<div class="card"><h2>Tempo previsto × tempo real por operação</h2>
<p class="sub">Onde a fábrica perde (ou ganha) tempo. Desvio positivo = levou mais que o previsto.</p>
<table><tr><th>Operação</th><th class="n">Ordens</th><th class="n">Peças</th><th class="n">Previsto</th><th class="n">Real</th><th class="n">Desvio</th><th>&nbsp;</th></tr>`;
const maxD=Math.max(...op.map(o=>Math.abs(o.real/o.prev-1)));
op.forEach(o=>{const dv=o.real/o.prev-1;
 h+=`<tr class="${dv>1?"est":""}"><td>${o.nome}</td><td class="n">${o.n}</td>
 <td class="n">${o.pc.toLocaleString("pt-BR")}</td>
 <td class="n">${Math.round(o.prev).toLocaleString("pt-BR")}h</td>
 <td class="n">${Math.round(o.real).toLocaleString("pt-BR")}h</td>
 <td class="n"><b style="color:${dv>0?"#c0392b":"#2e7d32"}">${dv>0?"+":""}${Math.round(dv*100)}%</b></td>
 <td><div class="bw" style="min-width:80px"><div class="bf ${dv>1?"r":(dv>0?"w":"g")}"
 style="width:${Math.min(Math.abs(dv)/maxD*100,100)}%"></div></div></td></tr>`});
h+=`</table><p class="nota">Operações com desvio muito alto em vermelho. Desvio negativo significa que a operação é mais rápida
que o tempo padrão — provável sinal de tempo padrão desatualizado, e não de ganho real.
Vale revisar os tempos padrão antes de usar isso para cobrar a equipe.</p></div>`;

/* ---------- 5. lead time ---------- */
if(D.lead&&D.lead.n){const L=D.lead;
h+=`<div class="card"><h2>Lead time de produção</h2>
<p class="sub">Dias entre o início do corte e o final da produção, em ${L.n} projetos do período.</p>
<div class="kpis">
 <div class="kpi"><div class="v">${L.p25}d</div><div class="l">25% terminam até</div></div>
 <div class="kpi al"><div class="v">${L.med}d</div><div class="l">mediana</div></div>
 <div class="kpi"><div class="v">${L.p75}d</div><div class="l">75% terminam até</div></div>
 <div class="kpi"><div class="v">${L.p90}d</div><div class="l">90% terminam até</div></div>
</div>
<p class="nota">O prazo de tabela usado na venda é de <b>14 dias</b> de produção (20 com pintura, 25 com lâmina).
A realidade mediana é <b>${L.med} dias</b>, e um quarto dos projetos passa de ${L.p75}.
Esse é um dos motivos de todo pedido parecer atrasado: a promessa não corresponde ao tempo real de passagem pela fábrica.</p></div>`;}

/* ---------- 6. qualidade dos dados ---------- */
const Q=D.qual;
h+=`<div class="card"><h2>Qualidade dos dados</h2>
<p class="sub">Problemas que distorcem os indicadores acima. Vale corrigir na origem.</p>
<div class="kpis">
 <div class="kpi ${Q.furo?"al":""}"><div class="v">${Q.furo}</div><div class="l">sem apontamento de corte · ${curto(Q.furo_pv)}</div></div>
 <div class="kpi"><div class="v">${Q.sem_inicio}</div><div class="l">final sem início de corte</div></div>
 <div class="kpi"><div class="v">${Q.zero_pecas.length}</div><div class="l">valor alto e zero peças</div></div>
 <div class="kpi"><div class="v">${Q.lotes.length}</div><div class="l">dias de lançamento em lote</div></div>
 <div class="kpi ${Q.invertido.length?"al":""}"><div class="v">${Q.invertido.length}</div><div class="l">final antes do início</div></div>
</div>`;
if(Q.lotes.length){h+=`<p class="nota" style="margin-top:12px"><b>Dias de lançamento em lote</b> (regularização em massa, não produção do dia) —
já excluídos dos números acima: ${Q.lotes.map(l=>l.d.split("-").reverse().join("/")+" ("+l.n+" projetos)").join(" · ")}</p>`;}
if(Q.furo){h+=`<p class="nota"><b>Apontamento de corte:</b> ${Q.furo} projetos estão em etapa posterior ao corte sem data de início.
O apontamento depende do operador ler o código na seccionadora — falha do computador ou esquecimento deixa o projeto sem registro,
e ele some da medição de produtividade.</p>`;}
if(Q.outliers.length){h+=`<p class="nota"><b>Valor possivelmente no ambiente errado</b> (R$/peça acima de 5× a mediana de ${moeda(Q.mediana_peca||0)}):</p>
<table style="margin-top:6px"><tr><th>Projeto</th><th>Ambiente</th><th>Cliente</th><th class="n">Valor</th><th class="n">Peças</th><th class="n">R$/peça</th></tr>`;
Q.outliers.forEach(o=>{h+=`<tr class="est"><td>${o.pj}</td><td>${o.amb}</td><td>${o.cli}</td>
 <td class="n">${moeda(o.pv)}</td><td class="n">${o.pc}</td><td class="n"><b>${moeda(o.rs)}</b></td></tr>`});
h+=`</table>`;}
if(Q.zero_pecas.length){h+=`<p class="nota"><b>Valor relevante e zero peças</b> — distorcem qualquer indicador por peça:</p>
<table style="margin-top:6px"><tr><th>Projeto</th><th>Ambiente</th><th>Cliente</th><th class="n">Valor</th></tr>`;
Q.zero_pecas.forEach(o=>{h+=`<tr><td>${o.pj}</td><td>${o.amb}</td><td>${o.cli}</td><td class="n">${moeda(o.pv)}</td></tr>`});
h+=`</table>`;}
h+=`<p class="nota">Fontes: ${D.fontes.projetos.toLocaleString("pt-BR")} projetos · ${D.fontes.consulta2.toLocaleString("pt-BR")} linhas de produto ·
${D.fontes.ppcp.toLocaleString("pt-BR")} apontamentos de operação · ${D.fontes.cronograma} projetos na carteira ativa.
Série desde ${D.desde}.</p></div>`;

app.innerHTML=h;

}
</script></div></body></html>
