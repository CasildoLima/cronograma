<title>Produtividade da Fábrica</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1b2430;font-size:13px}
header{padding:10px 14px;background:#0b2a5b;color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{margin:0;font-size:16px;font-weight:600}
header .upd{font-size:11px;opacity:.8;margin-left:auto}
header a{color:#8dd0f0;font-size:12px;text-decoration:none;margin-left:12px}
main{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:14px}
.card h2{margin:0 0 2px;font-size:14px;color:#0b2a5b}
.card p.sub{margin:0 0 12px;font-size:11px;color:#5a6673;line-height:1.5}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 150px;background:#f7f9fb;border:1px solid #e3e9ef;border-radius:7px;padding:9px 11px}
.kpi .v{font-size:19px;font-weight:700;color:#0b2a5b;line-height:1.15}
.kpi .l{font-size:10.5px;color:#5a6673;margin-top:2px}
.kpi.al .v{color:#c0392b}.kpi.ok .v{color:#2e7d32}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 7px;text-align:left;border-bottom:1px solid #edf0f3}
th{background:#eef2f6;color:#0b2a5b;font-weight:600;font-size:11px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.est td{background:#fdeeec}
.bw{position:relative;background:#eef1f4;border-radius:3px;height:16px;min-width:110px;overflow:hidden}
.bf{position:absolute;left:0;top:0;bottom:0;background:#0b2a5b;border-radius:3px}
.bf.w{background:#f0a500}.bf.r{background:#c0392b}.bf.g{background:#2e7d32}
.pct{position:absolute;right:5px;top:0;line-height:16px;font-size:10.5px;font-weight:700}
.nota{font-size:11px;color:#7a8692;margin-top:9px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:5px 11px;border:1px solid #c5ced8;border-radius:16px;font-size:11.5px;cursor:pointer;background:#fff}
.tab.on{background:#0b2a5b;color:#fff;border-color:#0b2a5b}
.graf{display:flex;align-items:stretch;gap:3px;height:150px;margin:10px 0 4px;position:relative;border-bottom:1px solid #cfd7e0}
/* Valor escrito em cima da barra. Fica ABSOLUTO, ancorado no topo da
   propria barra: se entrasse no fluxo, empurraria a barra para baixo e
   a linha tracejada da capacidade (posicionada em %) sairia do lugar.
   Como e absoluto, ele nao reserva espaco sozinho - quem reserva e a
   constante ESC no script, que limita a barra mais alta a 85% da area
   e deixa a faixa de cima livre para os rotulos. Sem isso o rotulo da
   barra mais alta sobe por cima do texto do card. */
.graf .vb{position:absolute;bottom:100%;left:-2px;right:-2px;text-align:center;
 font-size:9px;font-weight:700;color:#0b2a5b;line-height:1;padding-bottom:3px;white-space:nowrap}
.graf .vb.r{color:#c0392b}.graf .vb.g{color:#2e7d32}
.cap{position:absolute;left:0;right:0;border-top:1px dashed #0b2a5b;opacity:.5;font-size:9px;color:#0b2a5b;text-align:right}
.graf .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.graf .b{width:100%;background:#0b2a5b;border-radius:2px 2px 0 0;min-height:2px;position:relative}
.graf .b.g{background:#2e7d32}.graf .b.r{background:#c0392b}
.graf .t{font-size:9px;color:#5a6673;white-space:nowrap;transform:rotate(-45deg);transform-origin:top left;height:26px}
.gl{display:flex;gap:14px;font-size:11px;color:#5a6673;margin-top:20px}
.gl i{display:inline-block;width:11px;height:10px;border-radius:2px;margin-right:4px}
.lin{cursor:pointer}
.lin:hover td{background:#eef4fb}
.lin td:first-child::before{content:"\25B8 ";color:#5a6673;font-size:10px}
.lin.ab td:first-child::before{content:"\25BE ";color:#0b2a5b}
.det td{background:#fafbfc;padding:0}
.det table{font-size:11.5px;margin:0}
.det th{background:#f0f3f7;font-size:10px}
.tag{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;font-weight:700;background:#c0392b;color:#fff}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:100000,hash:"SHA-256"},km,{name:"AES-CBC",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(ENC.i)},k,b64(ENC.c));
 return JSON.parse(new TextDecoder().decode(pt));}
async function tentar(pw,silencioso){
 try{const d=await abrir(pw);try{localStorage.setItem("cr_pw",pw)}catch(e){}
  document.getElementById("gate").remove();document.getElementById("app").style.display="";boot(d);return true}
 catch(e){if(!silencioso){document.getElementById("gerr").textContent="Senha incorreta.";}return false}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tentar(document.getElementById("gp").value.trim(),false)});
(async()=>{let p=null;try{p=localStorage.getItem("cr_pw")}catch(e){}if(p)tentar(p,true)})();
function boot(D){

const CAP_MES=1000000;           // capacidade de referencia, R$/mes
// Patamares da planilha de custos (Custos 2026-07, aba Deducao
// Fabricacao MPV). Atualizar aqui quando a planilha mudar.
//   PE   = ponto de equilibrio: cobre custo fixo + variavel, lucro zero
//   META = vendas necessarias para a margem pretendida de 10%
// A margem pretendida NAO muda o PE (que e lucro zero), so a meta.
const PE=776772.55;              // ponto de equilibrio
const META=1010740.19;           // meta com 10% de margem (era 878.444 com 5%)
const VERMELHO=700000;           // abaixo disso o mes entra no vermelho
// A consultoria comecou em julho/2026 e so a partir dai passou a ser
// exigido o fechamento das ordens. Antes disso a SAIDA esta
// subestimada: havia projeto pronto sem baixa. O "dreno" de jul a set
// foi regularizacao, nao producao. Comparacoes de fluxo so valem daqui.
const MARCO_FECHAMENTO="2026-07";
const moeda=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");
const curto=v=>v>=1e6?(v/1e6).toFixed(2).replace(".",",")+" Mi":Math.round(v/1000)+" mil";
// A barra mais alta ocupa 85% da area do grafico; os 15% de cima sao
// para o rotulo de valor, que e posicionado fora do fluxo. Vale para
// as barras E para a linha de capacidade, senao as duas se desalinham.
const ESC=.85;
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const rot=m=>{const[a,b]=m.split("-");return MES[+b-1]+"/"+a.slice(2)};
document.getElementById("upd").textContent="Dados de "+UPD;

const S=D.serie, U=S.slice(-12);
const app=document.getElementById("app");
let h="";

/* ---------- 1. visao geral ---------- */
// CUIDADO COM OS DOIS CAMPOS:
//   "Inicio Producao" (base Projetos) = quando o projeto fica PRONTO
//      para a fila de corte. E o que existe no historico.
//   "Inicio Corte" (cronograma) = apontamento do operador na
//      seccionadora, o corte fisico. So existe para a carteira ativa.
// Entre um e outro ha mediana de 18 dias (p75 = 28). Esta serie usa o
// primeiro, entao mede ENTRADA NA FILA, nao corte efetivo. Ainda e a
// metrica mais confiavel do historico, porque o FINAL DE PRODUCAO e
// lancado em lote e oscila o dobro.
const tPV=U.reduce((a,s)=>a+s.cpv,0), tPC=U.reduce((a,s)=>a+s.pc,0);
const tPVf=U.reduce((a,s)=>a+s.fpv,0);

<p class="sub">Medido pela <b>entrada na fila de corte</b> (campo "Início Produção": quando o projeto fica pronto para cortar). O corte físico acontece em mediana <b>18 dias depois</b>, e só é apontado para a carteira ativa — o histórico não tem esse dado. O final de produção é fechado em lote, acumulando vários dias, e por isso oscila o dobro — serve para conferência, não para medir ritmo.<br>Valor a preço de fábrica (empresa Moveis Kretzer): o mesmo projeto existe duas vezes na base, uma com o valor da fábrica e outra com o da loja.</p>

${ocup<.85?"Ou seja: a sensação de estar sempre no limite não vem de falta de capacidade, e sim de fluxo e previsibilidade — fila mal distribuída, retrabalho e espera.":""}</p></div>`;

 const ord=Object.entries(et).sort((a,b)=>b[1].pv-a[1].pv);

  e.itens.sort((a,b)=>(b.atraso||0)-(a.atraso||0)||b.pv-a.pv).forEach(x=>{
