<title>Produtividade da Fábrica</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1b2430;font-size:13px}
header{padding:10px 14px;background:#0b2a5b;color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{margin:0;font-size:16px;font-weight:600}
header .upd{font-size:11px;opacity:.8;margin-left:auto}
header a{color:#8dd0f0;font-size:12px;text-decoration:none;margin-left:12px}
main{padding:14px;display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:14px}
.card h2{margin:0 0 2px;font-size:14px;color:#0b2a5b}
.card p.sub{margin:0 0 12px;font-size:11px;color:#5a6673;line-height:1.5}
.kpis{display:flex;flex-wrap:wrap;gap:10px}
.kpi{flex:1 1 150px;background:#f7f9fb;border:1px solid #e3e9ef;border-radius:7px;padding:9px 11px}
.kpi .v{font-size:19px;font-weight:700;color:#0b2a5b;line-height:1.15}
.kpi .l{font-size:10.5px;color:#5a6673;margin-top:2px}
.kpi.al .v{color:#c0392b}.kpi.ok .v{color:#2e7d32}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 7px;text-align:left;border-bottom:1px solid #edf0f3}
th{background:#eef2f6;color:#0b2a5b;font-weight:600;font-size:11px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.est td{background:#fdeeec}
.bw{position:relative;background:#eef1f4;border-radius:3px;height:16px;min-width:110px;overflow:hidden}
.bf{position:absolute;left:0;top:0;bottom:0;background:#0b2a5b;border-radius:3px}
.bf.w{background:#f0a500}.bf.r{background:#c0392b}.bf.g{background:#2e7d32}
.pct{position:absolute;right:5px;top:0;line-height:16px;font-size:10.5px;font-weight:700}
.nota{font-size:11px;color:#7a8692;margin-top:9px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:5px 11px;border:1px solid #c5ced8;border-radius:16px;font-size:11.5px;cursor:pointer;background:#fff}
.tab.on{background:#0b2a5b;color:#fff;border-color:#0b2a5b}
.graf{display:flex;align-items:stretch;gap:3px;height:150px;margin:10px 0 4px;position:relative;border-bottom:1px solid #cfd7e0}
/* Valor escrito em cima da barra. Fica ABSOLUTO, ancorado no topo da
   propria barra: se entrasse no fluxo, empurraria a barra para baixo e
   a linha tracejada da capacidade (posicionada em %) sairia do lugar.
   Como e absoluto, ele nao reserva espaco sozinho - quem reserva e a
   constante ESC no script, que limita a barra mais alta a 85% da area
   e deixa a faixa de cima livre para os rotulos. Sem isso o rotulo da
   barra mais alta sobe por cima do texto do card. */
.graf .vb{position:absolute;bottom:100%;left:-2px;right:-2px;text-align:center;
 font-size:9px;font-weight:700;color:#0b2a5b;line-height:1;padding-bottom:3px;white-space:nowrap}
.graf .vb.r{color:#c0392b}.graf .vb.g{color:#2e7d32}
.cap{position:absolute;left:0;right:0;border-top:1px dashed #0b2a5b;opacity:.5;font-size:9px;color:#0b2a5b;text-align:right}
.graf .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.graf .b{width:100%;background:#0b2a5b;border-radius:2px 2px 0 0;min-height:2px;position:relative}
.graf .b.g{background:#2e7d32}.graf .b.r{background:#c0392b}
.graf .t{font-size:9px;color:#5a6673;white-space:nowrap;transform:rotate(-45deg);transform-origin:top left;height:26px}
.gl{display:flex;gap:14px;font-size:11px;color:#5a6673;margin-top:20px}
.gl i{display:inline-block;width:11px;height:10px;border-radius:2px;margin-right:4px}
.lin{cursor:pointer}
.lin:hover td{background:#eef4fb}
.lin td:first-child::before{content:"\25B8 ";color:#5a6673;font-size:10px}
.lin.ab td:first-child::before{content:"\25BE ";color:#0b2a5b}
.det td{background:#fafbfc;padding:0}
.det table{font-size:11.5px;margin:0}
.det th{background:#f0f3f7;font-size:10px}
.tag{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;font-weight:700;background:#c0392b;color:#fff}

const UPD="27/11/2026";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:100000,hash:"SHA-256"},km,{name:"AES-CBC",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(ENC.i)},k,b64(ENC.c));
 return JSON.parse(new TextDecoder().decode(pt));}
async function tentar(pw,silencioso){
 try{const d=await abrir(pw);try{localStorage.setItem("cr_pw",pw)}catch(e){}
  document.getElementById("gate").remove();document.getElementById("app").style.display="";boot(d);return true}
 catch(e){if(!silencioso){document.getElementById("gerr").textContent="Senha incorreta.";}return false}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tentar(document.getElementById("gp").value.trim(),false)});
(async()=>{let p=null;try{p=localStorage.getItem("cr_pw")}catch(e){}if(p)tentar(p,true)})();
function boot(D){

const CAP_MES=1000000;           // capacidade de referencia, R$/mes
// Patamares da planilha de custos (Custos 2026-07, aba Deducao
// Fabricacao MPV). Atualizar aqui quando a planilha mudar.
//   PE   = ponto de equilibrio: cobre custo fixo + variavel, lucro zero
//   META = vendas necessarias para a margem pretendida de 10%
// A margem pretendida NAO muda o PE (que e lucro zero), so a meta.
const PE=776772.55;              // ponto de equilibrio
const META=1010740.19;           // meta com 10% de margem (era 878.444 com 5%)
const VERMELHO=700000;           // abaixo disso o mes entra no vermelho
// A consultoria comecou em julho/2026 e so a partir dai passou a ser
// exigido o fechamento das ordens. Antes disso a SAIDA esta
// subestimada: havia projeto pronto sem baixa. O "dreno" de jul a set
// foi regularizacao, nao producao. Comparacoes de fluxo so valem daqui.
const MARCO_FECHAMENTO="2026-07";
const moeda=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");
const curto=v=>v>=1e6?(v/1e6).toFixed(2).replace(".",",")+" Mi":Math.round(v/1000)+" mil";
// A barra mais alta ocupa 85% da area do grafico; os 15% de cima sao
// para o rotulo de valor, que e posicionado fora do fluxo. Vale para
// as barras E para a linha de capacidade, senao as duas se desalinham.
const ESC=.85;
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const rot=m=>{const[a,b]=m.split("-");return MES[+b-1]+"/"+a.slice(2)};
document.getElementById("upd").textContent="Dados de "+UPD;

const S=D.serie, U=S.slice(-12);
const app=document.getElementById("app");
let h="";

/* ---------- 1. visao geral ---------- */
// CUIDADO COM OS DOIS CAMPOS:
//   "Inicio Producao" (base Projetos) = quando o projeto fica PRONTO
//      para a fila de corte. E o que existe no historico.
//   "Inicio Corte" (cronograma) = apontamento do operador na
//      seccionadora, o corte fisico. So existe para a carteira ativa.
// Entre um e outro ha mediana de 18 dias (p75 = 28). Esta serie usa o
// primeiro, entao mede ENTRADA NA FILA, nao corte efetivo. Ainda e a
// metrica mais confiavel do historico, porque o FINAL DE PRODUCAO e
// lancado em lote e oscila o dobro.
const tPV=U.reduce((a,s)=>a+s.cpv,0), tPC=U.reduce((a,s)=>a+s.pc,0);
const tPVf=U.reduce((a,s)=>a+s.fpv,0);
const tFN=U.reduce((a,s)=>a+s.fn,0), tCN=U.reduce((a,s)=>a+s.cn,0);
const tPrev=U.reduce((a,s)=>a+s.prev,0), tReal=U.reduce((a,s)=>a+s.real,0);
const ocup=tPV/12/CAP_MES;
h+=`<div class="card"><h2>Últimos 12 meses</h2>
<p class="sub">Medido pela <b>entrada na fila de corte</b> (campo "Início Produção": quando o projeto fica pronto para cortar). O corte físico acontece em mediana <b>18 dias depois</b>, e só é apontado para a carteira ativa — o histórico não tem esse dado. O final de produção é fechado em lote, acumulando vários dias, e por isso oscila o dobro — serve para conferência, não para medir ritmo.<br>Valor a preço de fábrica (empresa Moveis Kretzer): o mesmo projeto existe duas vezes na base, uma com o valor da fábrica e outra com o da loja.</p>
<div class="kpis">
 <div class="kpi"><div class="v">${curto(tPV)}</div><div class="l">liberado para a fila</div></div>
 <div class="kpi"><div class="v">${curto(tPV/12)}</div><div class="l">média mensal liberada</div></div>
 <div class="kpi ${ocup<.8?"al":"ok"}"><div class="v">${Math.round(ocup*100)}%</div><div class="l">da capacidade de ${curto(CAP_MES)}/mês</div></div>
 <div class="kpi"><div class="v">${tCN}</div><div class="l">projetos liberados</div></div>
 <div class="kpi"><div class="v">${tFN}</div><div class="l">finalizados (lançado em lote)</div></div>
 <div class="kpi"><div class="v">${tPC.toLocaleString("pt-BR")}</div><div class="l">peças produzidas</div></div>
</div>
<p class="nota">A fábrica roda a <b>${Math.round(ocup*100)}% da capacidade</b>.
${ocup<.85?"Ou seja: a sensação de estar sempre no limite não vem de falta de capacidade, e sim de fluxo e previsibilidade — fila mal distribuída, retrabalho e espera.":""}</p></div>`;


/* ---------- 1b. o que esta na fabrica agora ---------- */
if(D.wip&&D.wip.length){
 const W=D.wip;
 const et={};
 W.forEach(x=>{const e=et[x.st]=et[x.st]||{n:0,pv:0,at:0,atpv:0,itens:[]};
  e.n++;e.pv+=x.pv;e.itens.push(x);if(x.atraso){e.at++;e.atpv+=x.pv}});
 const ord=Object.entries(et).sort((a,b)=>b[1].pv-a[1].pv);
 const tot=W.reduce((a,x)=>a+x.pv,0), tat=W.filter(x=>x.atraso).length;
 const atpv=W.filter(x=>x.atraso).reduce((a,x)=>a+x.pv,0);
 h+=`<div class="card"><h2>Dentro da fábrica agora</h2>
 <p class="sub">Posição em ${D.hoje}. Clique na etapa para ver os projetos.
 Atraso = dias além do prazo de produção do acabamento (14 MDF, 20 Lacca, 25 Lâmina), contados do corte.</p>

  <div class="kpi"><div class="v">${W.length}</div><div class="l">projetos na fábrica</div></div>
  <div class="kpi"><div class="v">${curto(tot)}</div><div class="l">valor em processo</div></div>
  <div class="kpi al"><div class="v">${tat}</div><div class="l">fora do prazo</div></div>
  <div class="kpi al"><div class="v">${curto(atpv)}</div><div class="l">valor atrasado</div></div>
 </div>
 <table style="margin-top:12px"><tr><th>Etapa</th><th class="n">Proj.</th><th class="n">Valor</th>
  <th class="n">Atrasados</th><th>Peso no total</th></tr>`;
 ord.forEach(([nome,e],i)=>{
  h+=`<tr class="lin" data-e="${i}"><td><b>${nome}</b></td><td class="n">${e.n}</td>
   <td class="n">${moeda(e.pv)}</td>
   <td class="n">${e.at?`<span class="tag">${e.at}</span>`:"—"}</td>

   <tr><th>Projeto</th><th>Ambiente</th><th>Cliente</th><th class="n">Valor</th>
   <th class="n">Corte</th><th class="n">Dias</th><th class="n">Prazo</th><th class="n">Atraso</th></tr>`;
  e.itens.sort((a,b)=>(b.atraso||0)-(a.atraso||0)||b.pv-a.pv).forEach(x=>{
   h+=`<tr class="${x.atraso?"est":""}"><td>${x.pj}</td><td>${x.amb}</td><td>${x.cli}</td>
    <td class="n">${moeda(x.pv)}</td>
    <td class="n">${x.dc?x.dc.split("-").reverse().join("/").slice(0,8):"—"}</td>
    <td class="n">${x.dias!=null?x.dias:"—"}</td><td class="n">${x.dur}</td>
    <td class="n">${x.atraso?`<span class="tag">+${x.atraso}</span>`:"—"}</td></tr>`});
  h+=`</table></td></tr>`});
 h+=`</table><p class="nota"><b>"Em Produção"</b> é a fila de corte: o projeto foi liberado mas ainda não teve apontamento na seccionadora, por isso não conta atraso. As demais etapas já passaram pelo corte.<br>
 <b>"081 - Disponível para Expedição"</b> merece leitura própria: o móvel já está pronto e embalado, aguardando o <b>fechamento da ordem de produção</b> — não é demora de fabricação. O fechamento é manual e só o gerente executa, porque ao tentar fechar pode aparecer material reservado sem baixa, e aí é preciso acionar o suprimentos para regularizar. Se há ou não pendência só se descobre na tentativa de fechar.</p></div>`;
}

 /* ---------- 2. serie mensal ---------- */
const maxPV=Math.max(...U.map(s=>Math.max(s.cpv,s.fpv)));
h+=`<div class="card"><h2>Produção mês a mês</h2>
<p class="sub">Barra = valor <b>liberado para a fila de corte</b> no mês. A linha tracejada é a capacidade de R$ 1 Mi.</p>
<div class="graf">`;
U.forEach(s=>{const al=s.cpv/maxPV*100;
 const cl=s.cpv>=CAP_MES?"g":(s.cpv<CAP_MES*.6?"r":"");
 h+=`<div class="c" title="${rot(s.m)} — iniciado: ${moeda(s.cpv)} em ${s.cn} projetos · finalizado: ${moeda(s.fpv)} em ${s.fn} · ${s.pc.toLocaleString("pt-BR")} peças">
 <div class="b ${cl}" style="height:${al*ESC}%"><div class="vb ${cl}">${curto(s.cpv)}</div></div></div>`});
h+=`<div class="cap" style="bottom:${CAP_MES/maxPV*100*ESC}%">capacidade ${curto(CAP_MES)}</div>`;
h+=`</div><div style="display:flex;gap:3px;margin-bottom:18px">`;
U.forEach(s=>{h+=`<div style="flex:1;text-align:center;font-size:9.5px;color:#5a6673;min-width:0">${rot(s.m)}</div>`});
h+=`</div>
<table><tr><th>Mês</th><th class="n">Proj.</th><th class="n">Entrou na fila</th><th>Capacidade</th>
 <th class="n">Finalizado</th><th class="n">Custo</th><th class="n">Peças</th><th class="n">Lead</th></tr>`;
U.forEach(s=>{const u=s.cpv/CAP_MES, cc=s.ccpv?s.fcusto/s.ccpv*100:0;
 h+=`<tr><td>${rot(s.m)}</td><td class="n">${s.cn}</td>
 <td class="n"><b>${moeda(s.cpv)}</b></td>
 <td><div class="bw"><div class="bf ${u>=1?"g":(u<.6?"r":"w")}" style="width:${Math.min(u*100,100)}%"></div>
 <div class="pct">${Math.round(u*100)}%</div></div></td>
 <td class="n" style="color:#7a8692">${moeda(s.fpv)}</td>
 <td class="n">${cc?cc.toFixed(0)+"%":"—"}</td>
 <td class="n">${s.pc.toLocaleString("pt-BR")}</td>
 <td class="n">${s.lead!=null?s.lead+"d":"—"}</td></tr>`});
h+=`</table><p class="nota">A coluna <b>Entrou na fila</b> é a medida de ritmo. <b>Finalizado</b> aparece em cinza porque é lançado em lote e distorce o mês.<br>Custo em % do valor, apenas nos projetos com detalhamento. Lead = mediana de dias entre início e final de produção.</p></div>`;

/* ---------- 2c. producao por INICIO DE CORTE REAL (via OP) ----------
   A serie acima mede entrada na fila. Esta mede o corte fisico, pelo
   primeiro apontamento na seccionadora. So existe de julho/2026 para
   ca, quando o "Codigo OP" passou a vir com o numero da OP - antes
   vinha no formato antigo e nao da para ligar projeto a apontamento.
   A cobertura vai na tabela: mes com cobertura baixa nao e queda de
   producao, e falta de dado. */
const CO=(D.corte||[]).filter(s=>s.opl>0);
if(CO.length){
const maxCO=Math.max(...CO.map(s=>s.pv));
const ult=CO[CO.length-1];
const comE=CO.filter(s=>s.esp!=null);
const maxE=Math.max(...comE.map(s=>s.esp75||s.esp),1);
const pico=comE.reduce((a,s)=>s.esp>a.esp?s:a,comE[0]);
h+=`<div class="card"><h2>Produção por início de corte real</h2>
<p class="sub">Mede o <b>corte físico</b>: o primeiro apontamento de tempo do operador na seccionadora. O quadro anterior mede a entrada na fila, que é outra coisa — entre um e outro existe uma espera, e é ela que o segundo gráfico mostra.<br>
O apontamento é por <b>ordem de produção</b>. A ligação com o projeto vem do campo "Código OP" quando ele já traz o número da OP (julho/2026 em diante) e, antes disso, da tabela de OPs do sistema, que converte o código antigo no número. Por isso a série cobre os 2 anos.</p>
<div class="kpis">
 <div class="kpi"><div class="v">${curto(ult.pv)}</div><div class="l">cortado em ${rot(ult.m)}</div></div>
 <div class="kpi"><div class="v">${ult.pj}</div><div class="l">projetos · ${ult.opl} OPs</div></div>
 <div class="kpi"><div class="v">${ult.pc.toLocaleString("pt-BR")}</div><div class="l">peças cortadas</div></div>
 <div class="kpi ${ult.esp<=10?"ok":"al"}"><div class="v">${ult.esp}d</div><div class="l">espera até o corte</div></div>
</div>
<p class="nota" style="margin-top:10px">A linha tracejada é o <b>ponto de equilíbrio de ${moeda(PE)}/mês</b> (planilha de custos: ${moeda(335566)} de custo fixo, 50% de matéria-prima e 6,8% de despesa variável). Abaixo dela o mês não paga a estrutura.
Barra <b style="color:#c0392b">vermelha</b> abaixo de ${curto(VERMELHO)}, <b style="color:#2e7d32">verde</b> a partir da meta de ${moeda(META)} — o necessário para a margem pretendida de 10%.
Repare que essa meta fica <b>acima da capacidade de referência de ${curto(CAP_MES)}/mês</b>: para entregá-la todo mês a fábrica teria que rodar a ${Math.round(META/CAP_MES*100)}% o tempo inteiro, sem folga.
Barra esmaecida = cobertura abaixo de 80%: o valor está incompleto por falta de ligação com a OP, não é queda de produção.<br>
<b>Ressalva nos meses antigos:</b> o ponto de equilíbrio é o da estrutura de custos de <b>hoje</b>. Em 2025 a fábrica era menor e o equilíbrio dela era mais baixo — aqueles meses no vermelho não significam que deram prejuízo na época, e sim que, com a estrutura atual, não pagariam as contas.</p>
<div class="graf" style="margin-top:14px">`;
// Cor pelo RESULTADO, igual ao quadro de cima: vermelho abaixo de
// R$ 700 mil, verde a partir da meta de vendas. Cobertura baixa nao
// pinta de vermelho - seria confundir falta de dado com prejuizo;
// ela aparece esmaecida e destacada na tabela.
CO.forEach(s=>{const cl=s.pv<VERMELHO?"r":(s.pv>=META?"g":"");
 h+=`<div class="c" title="${rot(s.m)} — ${moeda(s.pv)} em ${s.pj} projetos (${s.opl} de ${s.op} OPs) · ${s.pc.toLocaleString("pt-BR")} peças · espera ${s.esp!=null?s.esp+"d":"—"}${s.cob<80?" · cobertura "+s.cob+"%, valor incompleto":""}">
 <div class="b ${cl}" style="height:${s.pv/maxCO*100*ESC}%${s.cob<80?";opacity:.45":""}"><div class="vb ${cl}">${curto(s.pv)}</div></div></div>`});
h+=`<div class="cap" style="bottom:${PE/maxCO*100*ESC}%">equilíbrio ${curto(PE)}</div>`;
h+=`</div><div style="display:flex;gap:3px;margin-bottom:18px">`;
CO.forEach(s=>{h+=`<div style="flex:1;text-align:center;font-size:9.5px;color:#5a6673;min-width:0">${rot(s.m)}</div>`});
h+=`</div>`;

/* espera entre liberacao e corte */
if(comE.length>3){
h+=`<h2 style="margin-top:4px">Espera entre a liberação e o corte</h2>
<p class="sub">Dias que o projeto fica na fila depois de liberado, até alguém cortar. Barra cheia = mediana do mês; a marca clara é o percentil 75 (um em cada quatro espera mais que isso).</p>
<div class="graf">`;
comE.forEach(s=>{const cl=s.esp>=20?"r":(s.esp<=7?"g":"");
 h+=`<div class="c" title="${rot(s.m)} — mediana ${s.esp} dias, p75 ${s.esp75} dias (${s.espn} projetos)">
 <div class="b ${cl}" style="height:${s.esp/maxE*100*ESC}%"><div class="vb ${cl}">${s.esp}d</div></div></div>`});
h+=`</div><div style="display:flex;gap:3px;margin-bottom:14px">`;
comE.forEach(s=>{h+=`<div style="flex:1;text-align:center;font-size:9.5px;color:#5a6673;min-width:0">${rot(s.m)}</div>`});
h+=`</div>
<p class="nota">A espera subiu de <b>2 a 8 dias</b> (média de 2025) para o pico de <b>${pico.esp} dias em ${rot(pico.m)}</b>, e vem caindo desde então — ${comE.slice(-3).map(s=>rot(s.m)+": "+s.esp+"d").join(" · ")}.
Essa é a fila represada, e é o que a programação de cortes ataca: não adianta liberar mais se o corte não acompanha. Cada dia de espera aqui é um dia a mais no prazo do cliente, antes de a fábrica sequer começar.</p>`;}

h+=`<table><tr><th>Mês</th><th class="n">OPs</th><th class="n">Ligadas</th><th>Cobertura</th>
 <th class="n">Projetos</th><th class="n">Valor</th><th class="n">Peças</th><th class="n">Espera</th><th class="n">p75</th></tr>`;
CO.forEach(s=>{h+=`<tr${s.cob<80?' class="est"':""}><td>${rot(s.m)}${s.pv<PE?' <span class="tag">abaixo do equilíbrio</span>':""}</td>
 <td class="n">${s.op}</td><td class="n">${s.opl}</td>
 <td><div class="bw"><div class="bf ${s.cob>=90?"g":(s.cob<80?"r":"w")}" style="width:${s.cob}%"></div>
 <div class="pct">${s.cob}%</div></div></td>
 <td class="n">${s.pj}</td><td class="n"><b>${moeda(s.pv)}</b></td>
 <td class="n">${s.pc.toLocaleString("pt-BR")}</td>
 <td class="n ${s.esp>=20?"":""}"><b>${s.esp!=null?s.esp+"d":"—"}</b></td>
 <td class="n" style="color:#7a8692">${s.esp75!=null?s.esp75+"d":"—"}</td></tr>`});
h+=`</table><p class="nota"><b>Leia a cobertura antes do valor.</b> Ela diz quantas das OPs cortadas no mês foram ligadas a algum projeto — abaixo de 80% a linha fica destacada e o valor está incompleto por falta de ligação, não por queda de produção. Nesses meses a contagem de OPs (segunda coluna) é a medida confiável.<br>
<b>Peças é o número apontado na OP</b>, não rateado: aqui não passa pela estimativa por valor que a coluna Peças do cronograma usa.</p></div>`;}

/* ---------- 3. valor por peca ---------- */
h+=`<div class="card"><h2>Valor por peça</h2>
<p class="sub">Pintura e lâmina entram no valor do projeto e distorcem a comparação: dois projetos com as mesmas peças
custam diferente se um for laqueado. A coluna "sem acabamento" tira pintura e lâmina para a base ficar comparável.</p>
<table><tr><th>Mês</th><th class="n">Peças</th><th class="n">Valor detalhado</th><th class="n">Sem acabamento</th>
<th class="n">% acabamento</th><th class="n">R$/peça</th></tr>`;
let sb=0,sd=0;
U.forEach(s=>{const ac=s.det?(1-s.base/s.det)*100:null, rp=s.pc&&s.base?s.base/s.pc:null;
 sb+=s.base||0; sd+=s.det||0;
 h+=`<tr><td>${rot(s.m)}</td><td class="n">${s.pc.toLocaleString("pt-BR")}</td>
 <td class="n">${s.det?moeda(s.det):"—"}</td><td class="n">${s.base?moeda(s.base):"—"}</td>
 <td class="n">${ac!=null?ac.toFixed(1)+"%":"—"}</td>
 <td class="n"><b>${rp?moeda(rp):"—"}</b></td></tr>`});
h+=`</table><p class="nota">No período, <b>${sd?((1-sb/sd)*100).toFixed(1):"—"}%</b> do valor é pintura e lâmina.
<b>Atenção ao R$/peça:</b> as peças vêm dos apontamentos da PPCP, que cobrem parte das ordens, enquanto o valor vem da base inteira.
Serve para tendência, não como valor absoluto — a referência confiável é a mediana de ${moeda(D.qual.mediana_peca||0)}/peça da carteira ativa.</p></div>`;

/* ---------- 4. tempo previsto x real ----------
   Operacoes em que o apontamento ainda nao e confiavel ficam marcadas:
   desvio alto ali e falha de REGISTRO, nao de produtividade, e usar o
   numero para cobrar a equipe seria cobrar a pessoa errada.
   Tirar da lista conforme o apontamento for se regularizando. */
const SEM_APONT={"Embalagem":"apontamento de horas em regularização — a prioridade do setor hoje é o bip das peças na expedição"};
const op=D.oper.filter(o=>o.prev>0).slice(0,12);
h+=`<div class="card"><h2>Tempo previsto × tempo real por operação</h2>
<p class="sub">Onde a fábrica perde (ou ganha) tempo. Desvio positivo = levou mais que o previsto.</p>
<table><tr><th>Operação</th><th class="n">Ordens</th><th class="n">Peças</th><th class="n">Previsto</th><th class="n">Real</th><th class="n">Desvio</th><th>&nbsp;</th></tr>`;
const maxD=Math.max(...op.map(o=>Math.abs(o.real/o.prev-1)));
op.forEach(o=>{const dv=o.real/o.prev-1; const sa=SEM_APONT[o.nome];
 h+=`<tr class="${!sa&&dv>1?"est":""}"${sa?' style="opacity:.55"':""}><td>${o.nome}${sa?' <span class="tag">sem apontamento confiável</span>':""}</td><td class="n">${o.n}</td>
 <td class="n">${o.pc.toLocaleString("pt-BR")}</td>
 <td class="n">${Math.round(o.prev).toLocaleString("pt-BR")}h</td>
 <td class="n">${Math.round(o.real).toLocaleString("pt-BR")}h</td>
 <td class="n">${sa?"—":`<b style="color:${dv>0?"#c0392b":"#2e7d32"}">${dv>0?"+":""}${Math.round(dv*100)}%</b>`}</td>
 <td>${sa?"":`<div class="bw" style="min-width:80px"><div class="bf ${dv>1?"r":(dv>0?"w":"g")}"
 style="width:${Math.min(Math.abs(dv)/maxD*100,100)}%"></div></div>`}</td></tr>`});
h+=`</table><p class="nota">Operações com desvio muito alto em vermelho. Desvio negativo significa que a operação é mais rápida
que o tempo padrão — provável sinal de tempo padrão desatualizado, e não de ganho real.
Vale revisar os tempos padrão antes de usar isso para cobrar a equipe.<br>
<b>Linhas esmaecidas não têm apontamento confiável ainda</b> e por isso não mostram desvio: ${Object.entries(SEM_APONT).map(([k,v])=>`<b>${k}</b> — ${v}`).join(" · ")}.
Desvio nessas linhas seria falha de registro, não de produtividade — cobrar a equipe por ele seria cobrar a pessoa errada.</p></div>`;

/* ---------- 5. lead time ---------- */
if(D.lead&&D.lead.n){const L=D.lead;
h+=`<div class="card"><h2>Lead time de produção</h2>
<p class="sub">Dias entre o início do corte e o final da produção, em ${L.n} projetos do período.</p>
<div class="kpis">
 <div class="kpi"><div class="v">${L.p25}d</div><div class="l">25% terminam até</div></div>
 <div class="kpi al"><div class="v">${L.med}d</div><div class="l">mediana</div></div>
 <div class="kpi"><div class="v">${L.p75}d</div><div class="l">75% terminam até</div></div>
 <div class="kpi"><div class="v">${L.p90}d</div><div class="l">90% terminam até</div></div>
</div>
<p class="nota">O prazo de tabela usado na venda é de <b>14 dias</b> de produção (20 com pintura, 25 com lâmina).
A realidade mediana é <b>${L.med} dias</b>, e um quarto dos projetos passa de ${L.p75}.
Esse é um dos motivos de todo pedido parecer atrasado: a promessa não corresponde ao tempo real de passagem pela fábrica.</p></div>`;}

/* ---------- 6. qualidade dos dados ---------- */
const Q=D.qual;
h+=`<div class="card"><h2>Qualidade dos dados</h2>
<p class="sub">Problemas que distorcem os indicadores acima. Vale corrigir na origem.</p>
<div class="kpis">
 <div class="kpi ${Q.furo?"al":""}"><div class="v">${Q.furo}</div><div class="l">sem apontamento de corte · ${curto(Q.furo_pv)}</div></div>
 <div class="kpi"><div class="v">${Q.sem_inicio}</div><div class="l">final sem início de corte</div></div>
 <div class="kpi"><div class="v">${Q.zero_pecas.length}</div><div class="l">valor alto e zero peças</div></div>
 <div class="kpi"><div class="v">${Q.lotes.length}</div><div class="l">dias de lançamento em lote</div></div>
 <div class="kpi ${Q.invertido.length?"al":""}"><div class="v">${Q.invertido.length}</div><div class="l">final antes do início</div></div>
 <div class="kpi ${(Q.corrigidos||[]).length?"al":""}"><div class="v">${(Q.corrigidos||[]).length}</div><div class="l">valor corrigido automaticamente</div></div>
</div>`;
if((Q.corrigidos||[]).length){
const tc=Q.corrigidos.reduce((a,o)=>a+o.era-o.fica,0);
h+=`<p class="nota" style="margin-top:12px"><b>Valores corrigidos automaticamente</b> — ${Q.corrigidos.length} projetos, ${moeda(tc)} a menos.
Nesses projetos uma linha de produto do custo × produtividade (quase sempre <i>Chapas</i>) veio com valor absurdo, provavelmente
quantidade ou preço de chapa lançado errado no cadastro. Como o valor contratado no pedido é confiável, quando a soma dos produtos
passa de 3× o contratado o projeto inteiro é reescalado para o valor do pedido. <b>Todos os números desta página, do cronograma e
do controle comercial já saem corrigidos.</b> Vale corrigir na origem mesmo assim — o custo e a margem desses projetos continuam
errados no sistema.</p>
<table style="margin-top:6px"><tr><th>Projeto</th><th>Ambiente</th><th>Cliente</th><th class="n">Estava</th><th class="n">Corrigido</th><th class="n">Erro</th></tr>`;
Q.corrigidos.forEach(o=>{h+=`<tr class="est"><td>${o.pj}</td><td>${o.amb}</td><td>${o.cli}</td>
 <td class="n">${moeda(o.era)}</td><td class="n">${moeda(o.fica)}</td><td class="n"><b>${o.x}×</b></td></tr>`});
h+=`</table>`;}
if((Q.suspeitos||[]).length){
h+=`<p class="nota"><b>Vendidos muito abaixo do valor dos produtos</b> — ${Q.suspeitos.length} projetos em que os produtos somam entre 1,9× e 3× o valor de venda.
Chegaram aqui como suspeita de erro de valor, mas a conferência mostrou que <b>a maioria é desconto real</b>, não dado corrompido: o 56124-1 e o 56777-1 (Rudi Fontana),
por exemplo, saíram com a matéria-prima custando mais que o preço de venda. Por isso não são corrigidos — apagá-los transformaria prejuízo em dado limpo.
O tratamento deles é comercial, não técnico: o <b>Controle Comercial</b> traz a análise completa de realização de preço, por vendedor e por pedido.</p>
<table style="margin-top:6px"><tr><th>Projeto</th><th>Ambiente</th><th>Cliente</th><th class="n">Venda</th><th class="n">Produtos</th><th class="n">Razão</th></tr>`;
Q.suspeitos.forEach(o=>{h+=`<tr><td>${o.pj}</td><td>${o.amb}</td><td>${o.cli}</td>
 <td class="n">${moeda(o.pv)}</td><td class="n">${moeda(o.c2)}</td><td class="n">${o.x}×</td></tr>`});
h+=`</table>`;}
if(Q.lotes.length){h+=`<p class="nota" style="margin-top:12px"><b>Dias de lançamento em lote</b> (regularização em massa, não produção do dia) —
já excluídos dos números acima: ${Q.lotes.map(l=>l.d.split("-").reverse().join("/")+" ("+l.n+" projetos)").join(" · ")}</p>`;}
if(Q.furo){h+=`<p class="nota"><b>Apontamento de corte:</b> ${Q.furo} projetos estão em etapa posterior ao corte sem data de início.
O apontamento depende do operador ler o código na seccionadora — falha do computador ou esquecimento deixa o projeto sem registro,
e ele some da medição de produtividade.</p>`;}
if(Q.outliers.length){h+=`<p class="nota"><b>Valor possivelmente no ambiente errado</b> (R$/peça acima de 5× a mediana de ${moeda(Q.mediana_peca||0)}):</p>
<table style="margin-top:6px"><tr><th>Projeto</th><th>Ambiente</th><th>Cliente</th><th class="n">Valor</th><th class="n">Peças</th><th class="n">R$/peça</th></tr>`;
Q.outliers.forEach(o=>{h+=`<tr class="est"><td>${o.pj}</td><td>${o.amb}</td><td>${o.cli}</td>
 <td class="n">${moeda(o.pv)}</td><td class="n">${o.pc}</td><td class="n"><b>${moeda(o.rs)}</b></td></tr>`});
h+=`</table>`;}
if(Q.zero_pecas.length){
const tz=Q.zero_pecas.reduce((a,o)=>a+o.pv,0);
const sd=Q.zero_pecas.filter(o=>!o.dc).length;
h+=`<p class="nota"><b>Produzido sem apontamento de peças</b> — ${Q.zero_pecas.length} projetos, ${moeda(tz)}.
Todos já passaram do corte (estão em montagem externa, expedição ou etapa posterior) e mesmo assim não têm peças registradas.
A quantidade de peças vem da PPCP e só é gravada quando o operador aponta o corte na seccionadora${sd?`, e ${sd} deles estão sem data de corte nenhuma`:""} —
ou seja, para o sistema esses móveis nunca foram cortados. Somem do valor e das peças da medição de produtividade.</p>
<table style="margin-top:6px"><tr><th>Projeto</th><th>Ambiente</th><th>Cliente</th><th>Status</th><th class="n">Corte</th><th class="n">Valor</th></tr>`;
Q.zero_pecas.forEach(o=>{h+=`<tr class="${!o.dc?"est":""}"><td>${o.pj}</td><td>${o.amb}</td><td>${o.cli}</td>
 <td style="font-size:11px">${o.st||"—"}</td>
 <td class="n">${o.dc?o.dc.split("-").reverse().join("/").slice(0,8):"<b>sem data</b>"}</td>
 <td class="n">${moeda(o.pv)}</td></tr>`});
h+=`</table>`;}
h+=`<p class="nota">Fontes: ${D.fontes.projetos.toLocaleString("pt-BR")} projetos · ${D.fontes.consulta2.toLocaleString("pt-BR")} linhas de produto ·
${D.fontes.ppcp.toLocaleString("pt-BR")} apontamentos de operação · ${D.fontes.cronograma} projetos na carteira ativa.
Série desde ${D.desde}.</p></div>`;

app.innerHTML=h;
app.querySelectorAll(".lin").forEach(tr=>{tr.onclick=()=>{
 const d=document.getElementById("d"+tr.dataset.e);
 const ab=d.style.display!=="none";
 d.style.display=ab?"none":"";
 tr.classList.toggle("ab",!ab);
}});


}
</script></div></body></html>
