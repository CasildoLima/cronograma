<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cronograma de Produção</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#1b2430;font-size:13px}
header{padding:10px 14px;background:#0b2a5b;color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{margin:0;font-size:16px;font-weight:600}
header .upd{font-size:11px;opacity:.8;margin-left:auto}
.bar{padding:8px 14px;background:#fff;border-bottom:1px solid #dde3ea;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input,.bar select{padding:6px 8px;border:1px solid #c5ced8;border-radius:6px;font-size:13px;background:#fff;max-width:100%}
.bar input{flex:1 1 160px;min-width:120px}
.sl{font-size:11px;color:#46515e;display:flex;align-items:center;gap:4px}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#46515e;margin-left:auto}
.leg i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.cnt{font-size:11px;color:#46515e;padding:4px 14px}
#wrap{overflow:auto;height:calc(100vh - 150px);min-height:300px;background:#fff;position:relative}
table{border-collapse:separate;border-spacing:0}
th,td{padding:0}
.hd{position:sticky;top:0;z-index:5;background:#eef2f6;height:34px;border-bottom:1px solid #cfd7e0}
:root{--iw:300px}
.info{position:sticky;left:0;z-index:4;background:#fff;width:var(--iw);min-width:var(--iw);max-width:var(--iw);padding:5px 8px;border-right:2px solid #cfd7e0;border-bottom:1px solid #edf0f3;line-height:1.35;height:84px;vertical-align:top;word-break:break-word}
.hd.info{z-index:7;background:#eef2f6;font-weight:600;font-size:12px;vertical-align:middle}
.info b{font-size:12px}
.info span{display:block;color:#5a6673;font-size:11px}
.info .st{color:#0b2a5b}
.info .cl{color:#0b2a5b;font-size:13px;font-weight:700;margin:1px 0}
.info .cl small{font-size:11px;font-weight:400;color:#5a6673}
/* linha 1: a Ordem vem primeiro, em destaque - e a sequencia de corte
   definida na aba Programados. "—" quando o projeto ainda nao foi
   sequenciado. */
.info .l1{font-size:11px;color:#46515e}
.info .l1 small{font-size:10px;color:#7a8692}
.info .ord{display:inline-block;min-width:20px;text-align:center;background:#0b2a5b;color:#fff;
 border-radius:3px;padding:0 4px;margin-right:5px;font-size:11px}
.info .ord.vz{background:#e3e9ef;color:#9aa6b2}
.info .pz{color:#0b2a5b;font-weight:700}
.tlc{position:relative;padding:0;border-bottom:1px solid #edf0f3}
.tl{position:absolute;left:0;top:0;bottom:0;border-bottom:1px solid #edf0f3;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--w)*7 - 1px),#eef1f4 calc(var(--w)*7 - 1px),#eef1f4 calc(var(--w)*7))}
.hdtl{position:relative;height:34px}
.mk{position:absolute;top:0;height:34px;border-left:1px solid #b8c3cf;font-size:10px;padding-left:3px;color:#46515e;white-space:nowrap}
.mk.m{font-weight:600;color:#0b2a5b;border-left-color:#0b2a5b}
.b{position:absolute;border-radius:3px}
.b1{background:#8dd0f0;top:8px;bottom:8px;opacity:.85}
.b2{background:#ffe600;top:calc(50% - 17px);height:34px;opacity:.95}
.b3{background:#002060;top:calc(50% - 12px);height:24px}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #e11;z-index:3;pointer-events:none}
.par{position:absolute;top:0;bottom:0;z-index:0;background:repeating-linear-gradient(45deg,rgba(120,130,145,.22) 0 5px,rgba(120,130,145,.08) 5px 10px);border-left:1px solid #8c97a5;border-right:1px solid #8c97a5;pointer-events:none}
.parh{position:absolute;top:0;height:34px;z-index:0;background:repeating-linear-gradient(45deg,rgba(120,130,145,.3) 0 5px,rgba(120,130,145,.1) 5px 10px);border-left:1px solid #8c97a5;border-right:1px solid #8c97a5;font-size:9px;color:#46515e;text-align:center;line-height:34px;overflow:hidden}
.est{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 4px,transparent 4px 8px)}
/* atraso: o que passou do prazo de producao */
.b4{background:#c0392b;top:calc(50% - 12px);height:24px}
.b4.par{background:#e67e22}   /* ja saiu da producao: atraso congelado */
@media (max-width:640px){:root{--iw:200px}.leg{margin-left:0}#wrap{height:calc(100vh - 190px)}}
.ms{position:relative}
.ms summary{list-style:none;cursor:pointer;padding:6px 10px;border:1px solid #c5ced8;border-radius:6px;background:#fff;white-space:nowrap}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:" ▾"}
.ms[open] summary{border-color:#0b2a5b}
.ms.on summary{background:#e6eefb;border-color:#0b2a5b;font-weight:600}
.pan{position:absolute;z-index:20;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid #c5ced8;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-height:320px;overflow:auto;min-width:230px;max-width:86vw;padding:6px}
.pan label{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:4px;cursor:pointer}
.pan label:hover{background:#f0f4f9}
.pan .cl{display:block;width:100%;margin-bottom:4px;padding:5px;border:1px solid #c5ced8;border-radius:5px;background:#f7f9fb;cursor:pointer;font-size:12px}

const UPD="03/11/2026";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:100000,hash:"SHA-256"},km,{name:"AES-CBC",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(ENC.i)},k,b64(ENC.c));
 return JSON.parse(new TextDecoder().decode(pt));}
async function tentar(pw,silencioso){
 try{const d=await abrir(pw);try{localStorage.setItem("cr_pw",pw)}catch(e){}
  document.getElementById("gate").remove();document.getElementById("app").style.display="";boot(d);return true}
 catch(e){if(!silencioso){document.getElementById("gerr").textContent="Senha incorreta.";}return false}}
document.getElementById("gf").addEventListener("submit",e=>{e.preventDefault();tentar(document.getElementById("gp").value.trim(),false)});
(async()=>{let p=null;try{p=localStorage.getItem("cr_pw")}catch(e){}if(p)tentar(p,true)})();
function boot(DATA){

const W=7; // px por dia
const D0=Date.UTC(2000,0,1), DAY=86400000;
const di=s=>s?Math.round((Date.parse(s+"T00:00:00Z")-D0)/DAY):null;
const iso=n=>new Date(D0+n*DAY).toISOString().slice(0,10);
const br=s=>s?s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(2,4):"";
const now=new Date(); const today=Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-D0)/DAY);
const rows=DATA.map(r=>({...r,dp:di(r.ppcp),dc:di(r.inicio_corte),df:di(r.final_prod),dg:di(r.entrega_prog),dv:di(r.previsao_corte),o:parseFloat(r.ordem)}));
// Pintura e lamina so contam se forem relevantes: valores pequenos
// sao detalhe de acabamento e ficam no prazo de MDF.
// TEM QUE BATER com ACAB_PCT e ACAB_PISO do modAtualizarCronograma.bas.
const ACAB_PCT=1, ACAB_PISO=3000;
const vnum=v=>{const x=parseFloat(String(v||"").replace(",","."));return isNaN(x)?0:x};
const conta=(valor,pv)=>valor>0&&(valor>=ACAB_PISO||(pv>0&&valor/pv*100>=ACAB_PCT));
const dur=r=>{const pv=vnum(r.pv);
 if(conta(vnum(r.pv_lamina),pv))return 25;
 if(conta(vnum(r.pv_pintura),pv))return 20;
 return 14};
// ---- PARADAS DE PRODUCAO (ferias coletivas, feriadoes) -------------------
// Para acrescentar um periodo, basta incluir outro par ["inicio","fim"].
// O fim e o ULTIMO dia parado; a producao volta no dia seguinte.
const PARADAS=[["2026-12-19","2027-01-04","Férias coletivas"]];
const PAR=PARADAS.map(([a,b,n])=>({a:di(a),b:di(b),n:n}));
// empurra uma data que caia dentro de uma parada para o primeiro dia util depois
const pula=n=>{let m=true;while(m){m=false;for(const p of PAR)if(n>=p.a&&n<=p.b){n=p.b+1;m=true}}return n};
// soma dias corridos de producao ignorando os dias parados
const soma=(ini,d)=>{let n=pula(ini);for(let i=0;i<d;i++)n=pula(n+1);return n};
let mn=Infinity,mx=-Infinity;
rows.forEach(r=>{[r.dp,r.dc,r.df,r.dg,r.dv].forEach(x=>{if(x!=null){mn=Math.min(mn,x);mx=Math.max(mx,x)}});
 if(r.dc!=null&&r.df==null)mx=Math.max(mx,soma(r.dc,dur(r))); if(r.dv!=null)mx=Math.max(mx,soma(r.dv,dur(r)));});
mn=Math.min(mn,today-30);mx=Math.max(mx,today+30);
mn-=mn%7; // alinha
const tot=mx-mn+8;
document.getElementById("upd").textContent="Dados de "+UPD;
const uniq=k=>[...new Set(rows.map(r=>r[k]).filter(Boolean))].sort();
const SEL={status:new Set(),loja:new Set(),cliente:new Set()};
// pre: funcao opcional que diz se o valor ja vem marcado ao abrir a pagina
function ms(id,key,label,pre){const el=document.getElementById(id);const vals=uniq(key);
 const upd=()=>{const n=SEL[key].size;el.querySelector("summary").textContent=label+(n?" ("+n+")":"");el.classList.toggle("on",n>0)};
 const mk=v=>pre?pre(v):false;
 vals.forEach(v=>{if(mk(v))SEL[key].add(v)});
 el.innerHTML=`<summary></summary><div class="pan"><button type="button" class="cl">Limpar seleção</button>`+vals.map((v,i)=>`<label><input type="checkbox" value="${i}"${mk(v)?" checked":""}><span>${v}</span></label>`).join("")+`</div>`;
 el.querySelector(".cl").onclick=()=>{SEL[key].clear();el.querySelectorAll("input").forEach(c=>c.checked=false);upd();render()};
 el.querySelectorAll("input").forEach(c=>c.onchange=()=>{const v=vals[+c.value];c.checked?SEL[key].add(v):SEL[key].delete(v);upd();render()});
 upd();}
// Status ja abre com tudo marcado MENOS a Montagem Externa: ela nao
// disputa maquina, e assunto do comercial. Para ver, e so marcar.
ms("msS","status","Status",v=>!/^ME\b/i.test(String(v).trim()));
ms("msL","loja","Loja");ms("msC","cliente","Cliente");
document.addEventListener("click",e=>{document.querySelectorAll(".ms[open]").forEach(d=>{if(!d.contains(e.target))d.removeAttribute("open")})});
function bars(r){
 let h="";const L=d=>(d-mn)*W;
 PAR.forEach(p=>{h+=`<div class="par" style="left:${L(p.a)}px;width:${(p.b-p.a+1)*W}px" title="${p.n} ${br(iso(p.a))} a ${br(iso(p.b))}"></div>`});
 if(r.dp!=null&&r.dg!=null&&r.dg>=r.dp)h+=`<div class="b b1" style="left:${L(r.dp)}px;width:${(r.dg-r.dp+1)*W}px" title="PPCP ${br(iso(r.dp))} → Entrega prog. ${br(iso(r.dg))}"></div>`;
 if(r.dv!=null){const s=pula(r.dv),e=soma(r.dv,dur(r)),pr=e-s>dur(r);h+=`<div class="b b2" style="left:${L(s)}px;width:${(e-s+1)*W}px" title="Previsão de corte ${br(iso(r.dv))} + ${dur(r)} dias → Entrega prevista ${br(iso(e))}${pr?" (já descontada a parada de produção)":""}"></div>`;}
 if(r.dc!=null){const est=r.df==null;const s=pula(r.dc);const e=est?soma(r.dc,dur(r)):r.df;
  // --- prazo x atraso -------------------------------------------
  // A barra azul vai ate o PRAZO (corte + dias do acabamento).
  // O que passar disso vira barra de atraso, ate o final de producao
  // ou, se ainda nao terminou, ate hoje. Assim da para ver de longe
  // ha quantos dias o projeto esta parado na fabrica.
  const prazo=soma(r.dc,dur(r));
  // SAIU da fabrica = ME (montagem externa) ou Expedicao em transito.
  // "081 - Disponivel para Expedicao" NAO saiu: e fila interna, o movel
  // esta pronto esperando carregar - e justamente onde mais encalha.
  const st=(r.status||"").trim();
  const saiu=/^me\b/i.test(st)||/^expedi/i.test(st);
  // ate onde medir: final de producao, senao hoje (se ainda dentro da fabrica)
  const ate=r.df!=null?r.df:(saiu?null:today);
  // A barra azul vai ate o PRAZO, nao ate hoje: para quem esta dentro
  // do prazo ela mostra a carga que o projeto ainda vai ocupar.
  // So encurta quando o projeto finalizou antes do prazo.
  const fimAzul=r.df!=null?Math.min(prazo,r.df):prazo;
  if(fimAzul>=s)h+=`<div class="b b3${est?" est":""}" style="left:${L(s)}px;width:${(fimAzul-s+1)*W}px" title="Corte ${br(iso(r.dc))} → prazo ${br(iso(prazo))} (${dur(r)} dias)${est&&prazo-s>dur(r)?" · já descontada a parada de produção":""}"></div>`;
  if(ate!=null&&ate>prazo){const dias=ate-prazo;
   h+=`<div class="b b4${r.df!=null?" par":""}" style="left:${L(prazo+1)}px;width:${(ate-prazo)*W}px" title="ATRASO de ${dias} dia${dias>1?"s":""} — prazo era ${br(iso(prazo))}${r.df!=null?", finalizou em "+br(iso(r.df)):", e ainda não finalizou"}"></div>`;}
 }
 return h;}
function head(){let h=`<tr><th class="hd info">Projeto / Ambiente</th><th class="hd"><div class="hdtl" style="width:${tot*W}px;--w:${W}px">`;
 PAR.forEach(p=>{h+=`<div class="parh" style="left:${(p.a-mn)*W}px;width:${(p.b-p.a+1)*W}px" title="${p.n} ${br(iso(p.a))} a ${br(iso(p.b))}">${p.n}</div>`});
 for(let d=mn;d<=mx+7;d+=7){const dt=new Date(D0+d*DAY);const m=dt.getUTCDate()<=7;
  h+=`<div class="mk${m?" m":""}" style="left:${(d-mn)*W}px">${m?dt.toLocaleDateString("pt-BR",{month:"short",timeZone:"UTC"}).replace(".","")+"<br>":"<br>"}${String(dt.getUTCDate()).padStart(2,"0")}</div>`;}
 return h+`<div class="today" style="left:${(today-mn)*W+W/2}px"></div></div></th></tr>`;}
const cmp={prev:(a,b)=>((a.dv==null)-(b.dv==null))||(a.dv-b.dv),ppcp:(a,b)=>((a.dp==null)-(b.dp==null))||(a.dp-b.dp),corte:(a,b)=>((a.dc==null)-(b.dc==null))||(a.dc-b.dc),prog:(a,b)=>((a.dg==null)-(b.dg==null))||(a.dg-b.dg),ordem:(a,b)=>(isNaN(a.o)-isNaN(b.o))||(a.o-b.o),proj:(a,b)=>a.projeto.localeCompare(b.projeto),nada:()=>0};
function render(){
 const q=document.getElementById("q").value.toLowerCase();
 let f=rows.filter(r=>(!SEL.status.size||SEL.status.has(r.status))&&(!SEL.loja.size||SEL.loja.has(r.loja))&&(!SEL.cliente.size||SEL.cliente.has(r.cliente))&&(!q||(r.projeto+" "+r.cliente+" "+r.ambiente+" "+r.op).toLowerCase().includes(q)));
 f.sort((a,b)=>cmp[so.value](a,b)||cmp[so2.value](a,b)||cmp[so3.value](a,b)||cmp[so4.value](a,b)||a.projeto.localeCompare(b.projeto));
 document.getElementById("cnt").textContent=f.length+" de "+rows.length+" projetos";
 let h=head();
 f.forEach(r=>{h+=`<tr><td class="info">`+
   /* 1: ordem | OP | projeto | pedido | empresa */
   `<span class="l1">${r.ordem?`<b class="ord">${r.ordem}</b>`:`<b class="ord vz">—</b>`}`+
   `<b>${r.op||"s/ OP"}</b> · <b>${r.projeto}</b>${r.pedido?" · "+r.pedido:""}`+
   `${r.loja?` · <small>${r.loja}</small>`:""}</span>`+
   /* 2: cliente - ambiente (destaque) */
   `<span class="cl">${r.cliente}${r.ambiente?" <small>· "+r.ambiente+"</small>":""}</span>`+
   /* 3: status | entrega programada */
   `<span class="st">${r.status}${r.entrega_prog?` <b class="pz">Entr. ${br(r.entrega_prog)}</b>`:""}</span>`+
   /* 4: previsao de corte | corte | final de producao */
   `<span>P.Corte ${br(r.previsao_corte)||"—"} · Corte ${br(r.inicio_corte)||"—"} · Final ${br(r.final_prod)||"—"}</span>`+
   /* 5: pecas estimadas */
   `<span>${r.pecas?`Peças (estimativa): ~${r.pecas}`:"Peças: sem apontamento"}</span>`+
   `</td><td class="tlc" style="width:${tot*W}px;min-width:${tot*W}px"><div class="tl" style="width:${tot*W}px;--w:${W}px">${bars(r)}<div class="today" style="left:${(today-mn)*W+W/2}px"></div></div></td></tr>`;});
 document.getElementById("t").innerHTML=h;}
document.getElementById("iw").value=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--iw"))||300;
document.getElementById("iw").addEventListener("input",e=>document.documentElement.style.setProperty("--iw",e.target.value+"px"));
["q","so","so2","so3","so4"].forEach(i=>document.getElementById(i).addEventListener("input",render));
render();
document.getElementById("wrap").scrollLeft=Math.max(0,(today-mn)*W-120);

}
</script></div></body></html>
